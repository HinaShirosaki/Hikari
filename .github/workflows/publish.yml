name: Publish

# Publishing a GitHub release (tag vX.Y.Z matching package.json) pushes the
# package to both registries. npmjs is the public install channel
# (`npx @hinashirosaki/hikari`); GitHub Packages links the package to this
# repo so it shows in the repo sidebar.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  windows-distribution:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run dist
      - name: Verify installer and portable app output
        shell: pwsh
        run: |
          $setup = Get-Item out/Hikari-win32-x64/HikariSetup.exe -ErrorAction SilentlyContinue
          if (-not $setup -or $setup.Length -eq 0) { throw 'Expected a nonempty out/Hikari-win32-x64/HikariSetup.exe' }
          if (-not (Test-Path out/Hikari-win32-x64/Hikari/Hikari.exe)) { throw 'Expected the portable out/Hikari-win32-x64/Hikari/Hikari.exe' }
      - uses: actions/upload-artifact@v4
        with:
          name: Hikari-Windows-x64
          path: out/Hikari-win32-x64/HikariSetup.exe
          if-no-files-found: error
      - name: Attach Windows installer to published release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$env:RELEASE_TAG" out/Hikari-win32-x64/HikariSetup.exe --clobber

  npmjs:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # id-token lets npm prove this workflow's identity to npmjs (trusted
    # publishing) -- no NPM_TOKEN secret and no 2FA bypass token needed.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; Node 24 ships older.
      - run: npm install -g npm@latest
      # --tag latest: npm refuses a prerelease (1.1.0-beta.1) without an explicit
      # tag, and install.sh/install.ps1 and the in-app updater all read `latest`.
      # Skips a version that is already on npmjs (the first release was published
      # by hand, since trusted publishing can only be set up once the package exists).
      - run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@hinashirosaki/hikari@$version" version >/dev/null 2>&1; then
            echo "$version is already on npmjs; skipping"
          else
            npm publish --access public --tag latest
          fi

  github-packages:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
      - run: npm publish --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
