name: Publish

# Publishing a GitHub release (tag vX.Y.Z matching package.json) pushes the
# package to both registries. npmjs is the public install channel
# (`npx @hinashirosaki/hikari`); GitHub Packages links the package to this
# repo so it shows in the repo sidebar.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  npmjs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # id-token lets npm prove this workflow's identity to npmjs (trusted
    # publishing) -- no NPM_TOKEN secret and no 2FA bypass token needed.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; Node 24 ships older.
      - run: npm install -g npm@latest
      - run: npm publish --access public

  github-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
