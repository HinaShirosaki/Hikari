name: Publish

# Publishing a GitHub release (tag vX.Y.Z matching package.json) pushes the
# package to both registries. npmjs is the public install channel
# (`npx @hinashirosaki/hikari`); GitHub Packages links the package to this
# repo so it shows in the repo sidebar.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  distributions:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            platform: darwin
            arch: x64
          - runner: macos-latest
            platform: darwin
            arch: arm64
          - runner: windows-latest
            platform: win32
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check release identity
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          node -e 'const p=require("./package.json"); if (process.platform!==process.env.EXPECTED_PLATFORM || process.arch!==process.env.EXPECTED_ARCH) throw Error("Unexpected runner architecture"); if (process.env.RELEASE_TAG && process.env.RELEASE_TAG!=="v"+p.version) throw Error("Release tag does not match package.json")'
      - run: npm ci --allow-git=all
      - run: npm run dist
      - run: npm run release:assets
      - uses: actions/upload-artifact@v4
        with:
          name: Hikari-${{ matrix.platform }}-${{ matrix.arch }}
          path: out/release-assets/*
          if-no-files-found: error
      - name: Attach verified archives to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" out/release-assets/* --clobber
      - name: Retain the direct Windows installer download
        if: github.event_name == 'release' && matrix.platform == 'win32'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" out/Hikari-win32-x64/HikariSetup.exe --clobber

  npmjs:
    needs: [validate, distributions]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # id-token lets npm prove this workflow's identity to npmjs (trusted
    # publishing) -- no NPM_TOKEN secret and no 2FA bypass token needed.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; Node 24 ships older.
      - run: npm install -g npm@latest
      # --tag latest: npm refuses a prerelease (1.1.0-beta.1) without an explicit
      # tag, and install.sh/install.ps1 and the in-app updater all read `latest`.
      # Skips a version that is already on npmjs (the first release was published
      # by hand, since trusted publishing can only be set up once the package exists).
      - run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@hinashirosaki/hikari@$version" version >/dev/null 2>&1; then
            echo "$version is already on npmjs; skipping"
          else
            npm publish --access public --tag latest
          fi

  github-packages:
    needs: [validate, distributions]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
      - run: npm publish --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
