name: Windows install smoke

# Walks the path a Windows user takes -- pack this branch, `npx` the tarball,
# run HikariSetup.exe, check the installed app stays up -- on a clean runner.
# workflow_dispatch only reaches workflows on the default branch, so pushing to
# win-smoke/** is how you run this from a feature branch before it lands.
on:
  push:
    branches: ['win-smoke/**']
  workflow_dispatch:

jobs:
  install:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Pack this branch
        id: pack
        shell: pwsh
        run: |
          $tgz = npm pack --silent --pack-destination $env:RUNNER_TEMP | Select-Object -Last 1
          "tarball=$tgz" >> $env:GITHUB_OUTPUT

      # Same entry point as install.ps1's last line, against this branch's code
      # instead of the published package. The spec must be relative: npx treats
      # an absolute tarball path as a command and exits 0 without building.
      - name: npx the tarball
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: npx.cmd --yes "./${{ steps.pack.outputs.tarball }}"

      - name: Install, then watch the app Squirrel launches
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'hikari-out\Hikari-win32-x64\HikariSetup.exe'
          if (-not (Test-Path $setup)) { throw "No installer at $setup" }
          Start-Process $setup
          # Squirrel extracts, runs the app once per --squirrel-install hook, then
          # starts it for real; poll instead of guessing how long that takes.
          $deadline = (Get-Date).AddMinutes(5)
          do {
            Start-Sleep 5
            $exe = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'hikari') -Recurse -Filter Hikari.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.DirectoryName -match 'app-' } | Select-Object -First 1
          } while (-not $exe -and (Get-Date) -lt $deadline)
          if (-not $exe) { throw 'Installer never produced app-*\Hikari.exe' }
          Write-Host "Installed: $($exe.FullName)"
          # Helpers share the exe name (--type=...), and the --squirrel-install hook
          # run quits by design, so pick the real app by its command line.
          function Get-HikariMain {
            Get-CimInstance Win32_Process -Filter "Name='Hikari.exe'" |
              Where-Object { $_.CommandLine -notmatch '--type=|--squirrel-(install|updated|uninstall|obsolete)' } |
              Select-Object -First 1
          }
          do {
            Start-Sleep 5
            $running = Get-HikariMain
          } while (-not $running -and (Get-Date) -lt $deadline)
          if (-not $running) { Start-Process $exe.FullName; Start-Sleep 5; $running = Get-HikariMain }
          Write-Host "Main process: $($running.CommandLine)"
          Start-Sleep 30
          if (-not $running -or -not (Get-Process -Id $running.ProcessId -ErrorAction SilentlyContinue)) {
            Get-CimInstance Win32_Process -Filter "Name='Hikari.exe'" | ForEach-Object { Write-Host "still running: $($_.CommandLine)" }
            Get-Content (Join-Path $env:APPDATA 'Hikari\Logs\errors.log') -Tail 30 -ErrorAction SilentlyContinue
            throw 'Hikari exited within 30s of first launch'
          }
          Get-Process Hikari -ErrorAction SilentlyContinue | Stop-Process -Force
          "HIKARI_EXE=$($exe.FullName)" >> $env:GITHUB_ENV

      # A Start-menu launch gets no developer PATH; tests/installed-app-smoke.mjs
      # then drives the renderer over CDP.
      - name: Opening page, Codex discovery, and live MCP from the installed app
        shell: pwsh
        env:
          SMOKE_SHOT_DIR: ${{ runner.temp }}\smoke-shots
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force $env:SMOKE_SHOT_DIR | Out-Null
          function Start-Hikari {
            $full = $env:PATH
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            Start-Process $env:HIKARI_EXE -ArgumentList '--remote-debugging-port=9333'
            $env:PATH = $full
          }
          Start-Hikari
          node tests/installed-app-smoke.mjs opening
          # The folder picker is native; point Hikari at a workspace the way the picker would.
          Get-Process Hikari -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 5  # let the killed instance release its single-instance lock
          $workspace = Join-Path $env:RUNNER_TEMP 'HikariWorkspace'
          $config = Join-Path $env:APPDATA 'Hikari\Config'
          New-Item -ItemType Directory -Force $workspace, $config | Out-Null
          @{ storagePath = $workspace } | ConvertTo-Json | Set-Content (Join-Path $config 'last-storage-root.json')
          Start-Hikari
          node tests/installed-app-smoke.mjs codex-missing
          powershell -ExecutionPolicy ByPass -c "irm https://chatgpt.com/codex/install.ps1 | iex"
          node tests/installed-app-smoke.mjs codex-found
          node tests/installed-app-smoke.mjs mcp $workspace
          Get-Process Hikari -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: Hikari state on failure
        if: failure()
        shell: pwsh
        run: |
          Get-CimInstance Win32_Process -Filter "Name='Hikari.exe'" | ForEach-Object { "running: $($_.CommandLine)" }
          Get-ChildItem (Join-Path $env:APPDATA 'Hikari\Config') -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          Get-Content (Join-Path $env:APPDATA 'Hikari\Config\last-storage-root.json') -ErrorAction SilentlyContinue
          Get-Content (Join-Path $env:APPDATA 'Hikari\Logs\errors.log') -Tail 40 -ErrorAction SilentlyContinue
          try { (Invoke-WebRequest http://127.0.0.1:9333/json -UseBasicParsing).Content } catch { 'CDP: not listening' }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: ${{ runner.temp }}/smoke-shots
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HikariSetup
          path: ${{ runner.temp }}/hikari-out/Hikari-win32-x64/HikariSetup.exe
          if-no-files-found: error
