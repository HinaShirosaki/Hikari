name: CI

# Runs on every push so feature branches are covered -- this repo works on
# branches like feat/* and does not always open a pull request.
on:
  push:
  workflow_dispatch:
  workflow_call:

# A newer push to the same ref makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # `npm test` is the whole gate: it runs build:ui, then test.js, which
      # covers lint, the static checks, the selfchecks and the ~1000-test
      # suite. Generated files are not committed, so the build must run before
      # the checks that read index.html and styles.css.
      - run: npm test
      - name: Embedded Electron MCP startup
        run: node -e "require('node:child_process').execFileSync(process.execPath, ['tests/hikari-mcp-launch-selfcheck.js', '.', require('electron'), process.cwd()], {stdio:'inherit'})"
      - name: Workspace onboarding and recovery
        run: node node_modules/electron/cli.js tests/storage-setup-electron.cjs
