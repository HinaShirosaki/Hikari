<section id="gel-view" class="view">
      <div class="gel-workspace left-rail-template">
        <div class="gel-setup-panel app-left-rail left-rail-template__rail" data-sync-left-rail>
          <details id="gel-browser-panel" class="gel-browser-panel">
            <summary class="gel-browser-summary">
              <span>Existing Gels</span>
              <span id="gel-browser-count" class="small-note">0</span>
            </summary>
            <div class="gel-browser-body">
              <label>
                <span class="sr-only">Search Gels</span>
                <input id="gel-search" type="search" placeholder="Search saved gels" />
              </label>
              <div id="gel-list" class="gel-browser-list"></div>
            </div>
          </details>
          <form id="gel-form" class="form-grid">
            <input type="hidden" id="gel-id" />
            <div class="gel-form-fields">
              <section class="gel-setup-group" aria-labelledby="gel-setup-title">
                <h3 id="gel-setup-title" class="gel-setup-heading">Gel setup</h3>
                <label>
                  Gel Name
                  <input id="gel-name" required placeholder="e.g. WB_RUN_2026_02_19" />
                </label>
                <label>
                  Gel Image
                  <input id="gel-image-file" class="gel-wide-field" type="file" accept="image/*" />
                </label>
                <label>
                  Analysis Type
                  <select id="gel-type">
                    <option value="sds-page">SDS-PAGE</option>
                    <option value="western">Western Blot</option>
                    <option value="agarose">DNA/RNA Agarose</option>
                  </select>
                </label>
                <label>
                  Ladder Preset
                  <select id="gel-ladder-preset"></select>
                </label>
              </section>
              <section class="gel-setup-group" aria-labelledby="gel-processing-title">
                <h3 id="gel-processing-title" class="gel-setup-heading">Image processing</h3>
                <label class="gel-slider-field">
                  <span class="gel-slider-label">Denoise Strength</span>
                  <span id="gel-denoise-strength-value" class="small-note">35%</span>
                  <input id="gel-denoise-strength" type="range" min="0" max="100" step="1" value="35" />
                </label>
                <label class="gel-slider-field">
                  <span class="gel-slider-label">Contrast Boost</span>
                  <span id="gel-contrast-strength-value" class="small-note">100%</span>
                  <input id="gel-contrast-strength" type="range" min="0" max="220" step="1" value="100" />
                </label>
                <div class="form-actions gel-process-row">
                  <button type="button" id="gel-process-image-btn" class="ghost-btn gel-compact-btn">Process Image</button>
                </div>
              </section>
              <span id="gel-override-status" class="small-note" hidden>Manual overrides: none</span>
            </div>
            <div id="gel-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
            <div class="form-actions gel-record-actions">
              <button type="submit" id="gel-save-btn" class="primary-btn gel-record-btn" aria-label="Save" title="Save">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h12l4 4v12a2 2 0 0 1-2 2Z"></path><path d="M7 3v6h10V3M7 21v-8h10v8"></path></svg>
                <span class="sr-only" data-gel-action-label>Save</span>
              </button>
              <button type="button" id="gel-cancel-btn" class="ghost-btn gel-record-btn" aria-label="Cancel" title="Cancel">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m6 6 12 12M18 6 6 18"></path></svg>
                <span class="sr-only" data-gel-action-label>Cancel</span>
              </button>
              <button type="button" id="gel-export-csv-btn" class="ghost-btn gel-record-btn" aria-label="Export CSV" title="Export CSV">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"></path><path d="M14 2v6h6M12 11v7m-3-3 3 3 3-3"></path></svg>
                <span class="sr-only" data-gel-action-label>Export CSV</span>
              </button>
              <button type="button" id="gel-reset-overrides-btn" class="ghost-btn gel-record-btn" aria-label="Reset manual overrides" title="Reset manual overrides">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path></svg>
                <span class="sr-only">Reset manual overrides</span>
              </button>
            </div>
          </form>
        </div>

        <div class="gel-main left-rail-template__main">
          <div class="gel-main-stack">
            <div class="gel-main-grid">
              <div class="panel gel-viewer-panel">
                <h3>Gel Viewer</h3>
                <div class="gel-viewer-toolbar" role="toolbar" aria-label="Gel viewer tools">
                  <button type="button" id="gel-crop-mode-btn" class="ghost-btn gel-viewer-icon-btn gel-crop-mode-btn" aria-label="Start crop" title="Start crop" aria-pressed="false">
                    <svg class="gel-viewer-button-icon gel-crop-mode-icon gel-crop-mode-icon--start" viewBox="0 0 24 24" role="presentation" aria-hidden="true" focusable="false">
                      <path d="M6 3v13a2 2 0 0 0 2 2h13"></path>
                      <path d="M18 21V8a2 2 0 0 0-2-2H3"></path>
                    </svg>
                    <svg class="gel-viewer-button-icon gel-crop-mode-icon gel-crop-mode-icon--cancel" viewBox="0 0 24 24" role="presentation" aria-hidden="true" focusable="false">
                      <path d="m7 7 10 10"></path>
                      <path d="M17 7 7 17"></path>
                    </svg>
                  </button>
                  <button type="button" id="gel-apply-crop-btn" class="ghost-btn gel-viewer-icon-btn" aria-label="Apply crop" title="Apply crop" disabled hidden>
                    <svg class="gel-viewer-button-icon" viewBox="0 0 24 24" role="presentation" aria-hidden="true" focusable="false">
                      <path d="m5 12 4 4L19 6"></path>
                    </svg>
                  </button>
                  <button type="button" id="gel-reset-crop-btn" class="ghost-btn">Reset to Full Image</button>
                  <button type="button" id="gel-view-original-btn" class="ghost-btn" aria-pressed="true">View Original</button>
                  <button type="button" id="gel-finish-dividers-btn" class="ghost-btn" hidden title="Finish placing lane dividers (same as clicking Lane dividers again)">Finish dividers</button>
                  <button type="button" id="gel-export-image-btn" class="ghost-btn" disabled title="Export the gel lanes (and the table, if present) as a PNG">Export image</button>
                  <button type="button" id="gel-export-pptx-btn" class="ghost-btn" disabled title="Export the gel lanes (and the table, if present) as an editable PowerPoint">Export PPT</button>
                </div>
                <div class="gel-window-toolbar" role="toolbar" aria-label="Gel windows">
                  <button type="button" id="gel-open-tools-btn" class="ghost-btn" aria-controls="gel-tools-window" aria-expanded="true">Gel Tools</button>
                  <button type="button" id="gel-open-profile-btn" class="ghost-btn" aria-controls="gel-lane-profile-panel" aria-expanded="false" disabled>Lane Intensity</button>
                  <button type="button" id="gel-open-lane-table-btn" class="ghost-btn" aria-controls="gel-lane-table-panel" aria-expanded="false">Lane table</button>
                  <button type="button" id="gel-open-peak-editor-btn" class="ghost-btn" aria-controls="gel-peak-editor-overlay" aria-expanded="false">Peak editor</button>
                  <button type="button" id="gel-open-cell-table-btn" class="ghost-btn" aria-haspopup="dialog" aria-controls="gel-cell-table-overlay" aria-expanded="false" disabled>Band intensity</button>
                  <button type="button" id="gel-hide-windows-btn" class="ghost-btn">Hide windows</button>
                </div>
                <div id="gel-viewer-stage" class="gel-viewer-stage">
                  <div id="gel-image-row" class="gel-image-row">
                    <div id="gel-lane-table-label-spacer" class="gel-lane-table-label-spacer" hidden aria-hidden="true"></div>
                    <div class="gel-canvas-shell">
                      <canvas id="gel-canvas"></canvas>
                      <img id="gel-cropper-image" alt="Gel cropper" />
                    </div>
                  </div>
                  <section id="gel-lane-table-panel" class="gel-lane-table-panel" aria-labelledby="gel-lane-table-title" hidden>
                    <header class="gel-lane-table-head">
                      <h3 id="gel-lane-table-title">Lane table</h3>
                      <button type="button" id="gel-close-lane-table-btn" class="ghost-btn" aria-label="Hide lane table">×</button>
                    </header>
                    <div class="gel-lane-table-body">
                      <p id="gel-lane-table-empty" class="small-note">Finish the lane dividers, then add a table. The table is included in image and PowerPoint exports.</p>
                      <button type="button" id="gel-add-table-btn" class="ghost-btn" disabled>Add table</button>
                      <div id="gel-lane-table-shell" class="gel-lane-table-shell" hidden></div>
                    </div>
                  </section>
                </div>
                <form id="gel-ladder-mw-editor" class="gel-ladder-mw-editor" aria-label="Set ladder MW" hidden>
                  <input id="gel-ladder-band-mw" type="number" min="0" step="any" placeholder="MW" aria-label="Ladder MW (kDa)" required />
                </form>
              </div>

              <div class="gel-side-rail">
                <section id="gel-tools-window" class="panel gel-manual-panel gel-tool-panel" data-gel-window="tools" role="dialog" aria-modal="false" aria-labelledby="gel-tools-title">
                  <header class="gel-floating-head" data-gel-window-handle>
                    <h3 id="gel-tools-title">Gel Tools</h3>
                    <button type="button" class="ghost-btn gel-window-close" data-gel-window-close="tools" aria-label="Close Gel Tools">×</button>
                  </header>
                  <div class="gel-tool-tabs" role="group" aria-label="Tool groups">
                    <button type="button" class="ghost-btn" data-gel-tool-group="lane" aria-pressed="true">Lane</button>
                    <button type="button" class="ghost-btn" data-gel-tool-group="band" aria-pressed="false">Band</button>
                    <button type="button" class="ghost-btn" data-gel-tool-group="analysis" aria-pressed="false">Analysis</button>
                  </div>
                  <div class="gel-tool-groups">
                    <section class="gel-tool-group" data-gel-tool-panel="lane" aria-label="Lane tools">
                      <div class="gel-tool-actions">
                        <div class="gel-tool-control-row">
                          <label class="small-note gel-tool-field">
                            Lanes
                            <input type="number" id="gel-expected-lane-count" min="2" max="40" step="1" placeholder="auto" />
                          </label>
                          <button type="button" id="gel-auto-detect-lanes-btn" class="ghost-btn">Auto-detect</button>
                        </div>
                        <button type="button" id="gel-tool-dividers-btn" class="ghost-btn gel-tool-wide" aria-pressed="false" title="Click the gel to add lane boundaries; click this button again to finish. Outermost dividers define the gel edges">Lane dividers</button>
                        <button type="button" id="gel-tool-ladder-lane-btn" class="ghost-btn">Ladder lane</button>
                        <button type="button" id="gel-tool-lane-vertices-btn" class="ghost-btn">Lane vertices</button>
                      </div>
                    </section>

                    <section class="gel-tool-group" data-gel-tool-panel="band" aria-label="Band tools" hidden>
                      <div class="gel-tool-actions">
                        <button type="button" id="gel-tool-band-top-btn" class="ghost-btn">Band top</button>
                        <button type="button" id="gel-tool-band-bottom-btn" class="ghost-btn">Band bottom</button>
                        <button type="button" id="gel-lane-band-mode-btn" class="ghost-btn gel-tool-wide" aria-pressed="false">Per-lane band</button>
                      </div>
                    </section>

                    <section class="gel-tool-group" data-gel-tool-panel="analysis" aria-label="Analysis tools" hidden>
                      <div class="gel-tool-actions">
                        <button type="button" id="gel-detect-ladder-btn" class="ghost-btn" title="Detect ladder bands and label them from the selected preset">Detect ladder</button>
                        <button type="button" id="gel-tool-ladder-mw-btn" class="ghost-btn" aria-pressed="false" aria-controls="gel-ladder-mw-editor" title="Toggle MW labeling: click a band in the ladder lane to enter its MW; drag a label to move it">Set MW</button>
                      </div>
                    </section>
                  </div>
                  <div class="gel-tool-footer">
                    <button type="button" id="gel-manual-next-btn" class="ghost-btn" hidden>Done</button>
                    <button type="button" id="gel-manual-reset-btn" class="ghost-btn">Reset</button>
                  </div>
                </section>

                <section id="gel-lane-profile-panel" class="panel gel-manual-panel gel-lane-profile-panel" data-gel-window="profile" role="dialog" aria-modal="false" aria-labelledby="gel-profile-title" hidden>
                  <header class="gel-floating-head" data-gel-window-handle>
                    <h3 id="gel-profile-title">Lane Intensity</h3>
                    <button type="button" class="ghost-btn gel-window-close" data-gel-window-close="profile" aria-label="Close Lane Intensity">×</button>
                  </header>
                  <div class="gel-lane-profile-head">
                    <label class="gel-lane-profile-picker">
                      <span class="sr-only">Lane</span>
                      <select id="gel-lane-profile-select" disabled>
                        <option value="">Select lane</option>
                      </select>
                    </label>
                  </div>
                  <div class="gel-lane-profile-chart-shell">
                    <svg id="gel-lane-profile-chart" class="gel-lane-profile-chart" viewBox="0 0 320 190" role="img" aria-label="Lane intensity profile"></svg>
                  </div>
                </section>

              </div>
            </div>

          </div>

          <div id="gel-cell-table-overlay" data-gel-window="intensity" hidden>
            <section id="gel-cell-table-panel" class="gel-cell-table-dialog" role="dialog" aria-modal="false" aria-labelledby="gel-cell-table-title">
              <header class="gel-floating-head gel-cell-table-header" data-gel-window-handle>
                <div>
                  <h3 id="gel-cell-table-title">Band intensity</h3>
                  <span id="gel-cell-table-copy-status" class="small-note" role="status" aria-live="polite"></span>
                </div>
                <button type="button" id="gel-cell-table-copy-btn" class="ghost-btn" title="Copy all rows and headers for pasting into a spreadsheet" disabled>Copy table</button>
                <button type="button" id="gel-cell-table-close-btn" class="app-dialog-close-btn" aria-label="Close band intensity report" title="Close"><svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
              </header>
              <div id="gel-cell-table-host" class="gel-cell-table-host"></div>
            </section>
          </div>

          <div id="gel-peak-editor-overlay" class="gel-peak-editor-overlay" data-gel-window="peak" hidden>
            <section class="gel-peak-editor-dialog" role="dialog" aria-modal="false" aria-labelledby="gel-peak-editor-title">
              <header class="gel-peak-editor-header gel-floating-head" data-gel-window-handle>
                <div>
                  <h3 id="gel-peak-editor-title">Lane Peak Area</h3>
                  <div id="gel-peak-editor-summary" class="small-note"></div>
                </div>
                <button type="button" id="gel-peak-editor-close-btn" class="app-dialog-close-btn" aria-label="Close lane peak area dialog" title="Close"><svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
              </header>
              <div class="gel-peak-editor-toolbar" role="toolbar" aria-label="Peak area tools">
                <label class="gel-peak-editor-lane-picker small-note">
                  Lane
                  <select id="gel-peak-editor-lane-select"></select>
                </label>
                <div class="gel-peak-editor-modes">
                  <button type="button" id="gel-peak-editor-baseline-mode-btn" class="ghost-btn is-active" aria-pressed="true">Baseline</button>
                  <button type="button" id="gel-peak-editor-divider-mode-btn" class="ghost-btn" aria-pressed="false">Divider</button>
                </div>
                <button type="button" id="gel-peak-editor-clear-lane-btn" class="ghost-btn">Clear lane</button>
                <button type="button" id="gel-peak-editor-clear-all-btn" class="ghost-btn">Clear all</button>
              </div>
              <div class="gel-peak-editor-chart-shell">
                <svg id="gel-peak-editor-chart" class="gel-peak-editor-chart" viewBox="0 0 920 440" preserveAspectRatio="none" role="img" aria-label="Manual peak area editor"></svg>
              </div>
              <div id="gel-peak-editor-table" class="gel-peak-editor-table"></div>
            </section>
          </div>
        </div>
      </div>
    </section>
