<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Host Dialog Screenshot Harness</title>
  <link rel="stylesheet" href="../../styles.css?v=dialog-screenshot-1" />
  <link rel="stylesheet" href="../../ui/css/overrides/universal-dialogs.css?v=dialog-screenshot-1" />
</head>
<body>
  <p id="harness-status" role="status">Loading dialog…</p>
  <script type="module">
    import { installDialogLayout } from '../../src/renderer/app/dialog-layout.js';

    const params = new URLSearchParams(window.location.search);
    const dialogId = params.get('dialog') || 'unsaved-changes-overlay';
    const response = await fetch(`../../index.html?v=dialog-screenshot-1`);
    const source = new DOMParser().parseFromString(await response.text(), 'text/html');
    const appShell = source.querySelector('.app-shell');
    const unsavedOverlay = source.getElementById('unsaved-changes-overlay');

    document.body.replaceChildren(appShell);
    if (unsavedOverlay) {
      document.body.append(unsavedOverlay);
    }

    const dockNav = document.getElementById('app-dock-nav');
    if (dockNav) {
      dockNav.innerHTML = ['Home', 'Notebook', 'Samples', 'Assays', 'Papers', 'Sequence', 'Agent']
        .map((label, index) => `
          <button class="app-dock-btn${index === 0 ? ' is-active' : ''}" type="button" data-label="${label}" aria-label="${label}">
            <span aria-hidden="true">${label.slice(0, 1)}</span>
          </button>
        `)
        .join('');
    }
    document.getElementById('page-title').textContent = 'Dialog QA';
    document.getElementById('page-subtitle').textContent = 'Production popup window screenshot';

    document.querySelectorAll('.view').forEach((view) => {
      view.classList.remove('is-active');
      view.hidden = true;
    });
    document.querySelectorAll('.app-dialog-overlay').forEach((overlay) => {
      overlay.hidden = true;
    });

    const target = document.getElementById(dialogId);
    if (!target) {
      throw new Error(`Unknown dialog: ${dialogId}`);
    }
    target.hidden = false;
    if (dialogId === 'unsaved-changes-overlay') {
      // Mirrors createUnsavedChangesService(): several dirty editors render as
      // a checklist, a single one renders as plain text.
      const unsavedList = document.getElementById('unsaved-changes-list');
      const labels = (params.get('unsaved') || 'Sample,Notebook,Assay').split(',').filter(Boolean);
      if (unsavedList && !unsavedList.children.length) {
        document.getElementById('unsaved-changes-description').textContent = labels.length > 1
          ? 'Pick what to save. Anything left unchecked is discarded on quit.'
          : 'The following work has not been saved.';
        unsavedList.append(...labels.map((label, index) => {
          const item = document.createElement('li');
          if (labels.length < 2) {
            item.textContent = label;
            return item;
          }
          const option = document.createElement('label');
          option.className = 'unsaved-changes-option';
          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.checked = index < labels.length - 1;
          const text = document.createElement('span');
          text.textContent = label;
          option.append(checkbox, text);
          item.append(option);
          return item;
        }));
        document.getElementById('unsaved-changes-save-btn').textContent = labels.length > 2
          ? `Save ${labels.length - 1} & Quit`
          : 'Save & Quit';
        document.getElementById('unsaved-changes-discard-btn').textContent = labels.length > 1
          ? 'Discard All & Quit'
          : 'Discard & Quit';
      }
    }
    let ancestor = target.parentElement;
    while (ancestor) {
      ancestor.hidden = false;
      if (ancestor.classList.contains('view')) {
        ancestor.classList.add('is-active');
      }
      ancestor = ancestor.parentElement;
    }

    installDialogLayout();
    document.documentElement.dataset.dialogQaReady = 'true';
    document.documentElement.dataset.dialogQaId = dialogId;
  </script>
</body>
</html>
