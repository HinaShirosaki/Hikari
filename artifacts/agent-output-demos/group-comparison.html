<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Group comparison</title><style>
:root{color-scheme:light dark;font:1rem/1.5 system-ui,sans-serif}body{margin:0;padding:1.2rem}h1{font-size:1.4rem;margin:0}label{display:block;font-weight:600;margin-top:1rem}select,button{font:inherit;padding:.45rem .6rem;max-width:100%}table{border-collapse:collapse;width:100%;margin:1rem 0}th,td{text-align:left;padding:.45rem;border-bottom:1px solid #b6bfca}strong{font-size:1.35rem}.note{opacity:.75}#summary{padding:1rem;background:light-dark(#edf2ff,#263045);border-radius:.5rem}
</style></head><body><h1>Compare the illustrative groups</h1><p>Choose a group and switch between raw response and fold change relative to the control mean.</p><label for="group">Group</label><select id="group"><option value="all">All groups</option><option>Control</option><option>Low dose</option><option>High dose</option></select><label for="mode">Display</label><select id="mode"><option value="raw">Response (arbitrary units)</option><option value="fold">Fold change vs control</option></select><table><thead><tr><th>Group</th><th>n</th><th id="unit">Mean (a.u.)</th><th>Sample SD</th></tr></thead><tbody id="rows"></tbody></table><p id="summary" aria-live="polite"></p><button id="reset" type="button">Reset</button><p class="note">Synthetic triplicates: Control [10, 12, 11], Low dose [18, 22, 20], High dose [28, 32, 30]. SD uses n−1. No significance test is implied.</p><script>
const groups=[{name:'Control',values:[10,12,11]},{name:'Low dose',values:[18,22,20]},{name:'High dose',values:[28,32,30]}];const mean=a=>a.reduce((s,v)=>s+v,0)/a.length;const group=document.querySelector('#group'),mode=document.querySelector('#mode');function render(){const items=groups.filter(g=>group.value==='all'||g.name===group.value),base=mean(groups[0].values),fold=mode.value==='fold';document.querySelector('#unit').textContent=fold?'Mean (fold)':'Mean (a.u.)';const rows=document.querySelector('#rows');rows.replaceChildren();for(const g of items){const m=mean(g.values),sd=Math.sqrt(g.values.reduce((s,v)=>s+(v-m)**2,0)/(g.values.length-1)),scale=fold?base:1,tr=document.createElement('tr');for(const value of[g.name,g.values.length,(m/scale).toFixed(2),(sd/scale).toFixed(2)]){const td=document.createElement('td');td.textContent=value;tr.append(td)}rows.append(tr)}document.querySelector('#summary').textContent=items.length+' group'+(items.length===1?'':'s')+' shown · '+(fold?'Control mean = 1.00 fold':'Raw measurements in arbitrary units');}group.addEventListener('change',render);mode.addEventListener('change',render);document.querySelector('#reset').addEventListener('click',()=>{group.value='all';mode.value='raw';render()});render();</script></body></html>
