<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dose-response playground</title><style>
:root{color-scheme:light dark;font:1rem/1.5 system-ui,sans-serif}body{margin:0;padding:1.25rem}main{max-width:48rem;margin:auto}h1{font-size:1.4rem;margin:0}p{margin:.5rem 0 1rem}label{display:block;font-weight:600;margin-top:1rem}input{width:100%;accent-color:#5579df}svg{display:block;width:100%;height:auto}text{fill:currentColor;font:14px system-ui}.metrics{display:flex;flex-wrap:wrap;gap:.8rem;margin:1rem 0}.metric{flex:1;min-width:8rem;padding:.8rem;border-radius:.6rem;background:light-dark(#edf2ff,#263045)}.metric strong{display:block;font-size:1.5rem}button{font:inherit;padding:.4rem .8rem}output{font-variant-numeric:tabular-nums}.note{font-size:.9rem;opacity:.75}
</style></head><body><main><h1>Dose-response playground</h1><p>Illustrative Hill model. Change EC50 and slope to explore the curve; this is not a fit to experimental data.</p>
<label for="ec50">EC50: <output id="ec50-label">3.0</output> µM</label><input id="ec50" type="range" min=".5" max="8" step=".5" value="3">
<label for="hill">Hill slope: <output id="hill-label">2.0</output></label><input id="hill" type="range" min=".5" max="4" step=".5" value="2">
<svg id="chart" viewBox="0 0 620 300" role="img" aria-label="Model response by concentration"><path d="M65 25V245H595" fill="none" stroke="#9aa6b5"/><path id="curve" fill="none" stroke="#5579df" stroke-width="4"/><line id="half" y1="135" y2="245" stroke="#d38754" stroke-dasharray="5 5"/><text x="8" y="30">100%</text><text x="20" y="140">50%</text><text x="35" y="250">0%</text><text x="62" y="267">0</text><text x="570" y="267">12</text><text x="250" y="294">Concentration (µM)</text></svg>
<div class="metrics" aria-live="polite"><div class="metric">At 3 µM<strong id="response"></strong></div><div class="metric">Half maximum<strong id="half-label"></strong></div></div>
<button id="reset" type="button">Reset controls</button><p class="note">Response = 100 × xⁿ / (EC50ⁿ + xⁿ). Controls affect this preview only.</p>
<script>const ec50=document.querySelector('#ec50'),hill=document.querySelector('#hill');function render(){const e=Number(ec50.value),n=Number(hill.value);document.querySelector('#ec50-label').textContent=e.toFixed(1);document.querySelector('#hill-label').textContent=n.toFixed(1);const f=x=>100*x**n/(e**n+x**n);let d='';for(let i=0;i<=120;i++){const x=i/10;d+=(i?'L':'M')+(65+x/12*530).toFixed(2)+' '+(245-f(x)*2.2).toFixed(2)+' ';}document.querySelector('#curve').setAttribute('d',d);const half=document.querySelector('#half');half.setAttribute('x1',65+e/12*530);half.setAttribute('x2',65+e/12*530);document.querySelector('#response').textContent=f(3).toFixed(1)+'%';document.querySelector('#half-label').textContent=e.toFixed(1)+' µM';}ec50.addEventListener('input',render);hill.addEventListener('input',render);document.querySelector('#reset').addEventListener('click',()=>{ec50.value=3;hill.value=2;render()});render();</script></main></body></html>
