<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Buffer Ratio</title>
    <style>
      /* Tools draws the title and description above this frame, so the page
         holds only the tool's own controls. */
      body { margin: 0; padding: 4px 2px; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
      label { display: block; margin: 12px 0 4px; font-weight: 600; font-size: 13px; }
      input { width: 100%; max-width: 320px; padding: 6px 8px; font: inherit; }
      output { display: block; margin-top: 16px; }
    </style>
  </head>
  <body>
    <label for="compound">Buffer compound</label>
    <input id="compound" list="compounds" placeholder="Loading&hellip;" autocomplete="off" disabled />
    <datalist id="compounds"></datalist>
    <label for="ph">Target pH</label>
    <input id="ph" type="number" step="0.01" value="7.4" />
    <output id="result" aria-live="polite"></output>
    <script src="./hikari.js"></script>
    <script src="./main.js"></script>
  </body>
</html>
