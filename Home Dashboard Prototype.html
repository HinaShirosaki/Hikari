<!doctype html>
<!-- @dsCard group="Brand" name="Home Dashboard — Prototype" subtitle="Direction A wired up: live timers, working dialogs, quick log, toasts" -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hikari — Home Dashboard (Prototype)</title>
  <link rel="stylesheet" href="tokens.css" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <style>
    html, body { height: 100%; }
    body { margin: 0; background: var(--bg); font-family: var(--font-app); color: var(--text); overflow: auto; }
    #root { height: 100%; }
    button { font-family: var(--font-app); }

    .home {
      width: 100%; height: 100vh; box-sizing: border-box;
      min-width: 1180px; min-height: 740px;
      padding: 12px 22px 20px;
      display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 12px;
    }

    /* top dock bar */
    .topbar { position: relative; z-index: 12; display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); align-items: center; gap: 14px; padding: 2px 0 8px; border-bottom: 1px solid var(--line-soft); }
    .topbar-brand { display: grid; min-width: 0; justify-self: start; }
    .topbar-page-title { margin: 0; color: var(--strong); font-size: 1.18rem; font-weight: 650; line-height: 1.1; }
    .topbar-page-sub { margin: 2px 0 0; color: var(--muted); font-size: 0.82rem; }
    .app-dock { display: flex; align-items: center; justify-content: center; gap: 6px; justify-self: center; }
    .app-dock-nav { display: flex; align-items: center; gap: 4px; }
    .app-dock-divider { width: 1px; height: 26px; background: var(--line); margin: 0 4px; }
    .app-dock-btn { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; padding: 0; border-radius: 8px; border: 1px solid transparent; background: transparent; color: var(--muted); cursor: pointer; transition: var(--transition-fast); }
    .app-dock-btn svg { width: 22px; height: 22px; }
    .app-dock-btn:hover, .app-dock-btn:focus-visible, .app-dock-btn.is-active { color: var(--strong); background: var(--surface-subtle); border-color: var(--line); outline: none; }
    .app-dock-btn.is-active::after { content: ''; position: absolute; left: 11px; right: 11px; bottom: 4px; height: 2px; border-radius: 2px; background: var(--accent); }
    .app-dock-btn::before { content: attr(data-label); position: absolute; left: 50%; top: calc(100% + 9px); transform: translate(-50%, -6px); padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-elevated); color: var(--strong); font-size: 0.75rem; line-height: 1.2; white-space: nowrap; opacity: 0; pointer-events: none; z-index: 30; box-shadow: var(--shadow-float); transition: opacity 120ms ease, transform 120ms ease; }
    .app-dock-btn:hover::before, .app-dock-btn:focus-visible::before { opacity: 1; transform: translate(-50%, 0); }
    .app-dock-btn-more { width: 36px; }
    .topbar-tools { justify-self: end; display: flex; align-items: center; gap: 8px; width: clamp(220px, 24vw, 340px); }
    .topbar-history { display: inline-flex; gap: 2px; flex: 0 0 auto; }
    .hist-btn { width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; border-radius: var(--radius-md); border: 1px solid transparent; background: transparent; color: var(--muted); cursor: pointer; }
    .hist-btn:not(:disabled):hover { background: var(--surface-subtle); color: var(--strong); }
    .hist-btn:disabled { opacity: 0.4; cursor: default; }
    .hist-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .topbar-search { position: relative; flex: 1 1 auto; display: flex; align-items: center; }
    .topbar-search > svg { position: absolute; left: 10px; width: 16px; height: 16px; color: var(--muted); pointer-events: none; }
    .topbar-search input { width: 100%; box-sizing: border-box; padding: 8px 11px 8px 32px; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface); color: var(--text); font-size: 0.85rem; font-family: var(--font-app); }
    .topbar-search input::placeholder { color: var(--muted); }
    .topbar-search input:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; border-color: transparent; }

    /* context bar */
    /* context strip */
    .home-bar { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .home-bar-left { display: flex; align-items: baseline; gap: 12px; min-width: 0; flex-wrap: wrap; }
    .home-clock { font-size: 1.42rem; font-weight: 650; color: var(--strong); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; line-height: 1; }
    .home-date { font-size: 0.86rem; color: var(--muted); white-space: nowrap; }
    .glance { display: flex; align-items: center; gap: 7px; }
    .gpill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-elevated); font-size: 0.8rem; color: var(--strong); white-space: nowrap; }
    .gpill b { font-weight: 650; font-variant-numeric: tabular-nums; }
    .gpill .gnum { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 0.78rem; }

    .qa { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
    .qa-btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 11px; white-space: nowrap; border-radius: var(--radius-md); border: 1px solid var(--line); background: var(--surface-elevated); color: var(--strong); font-size: 0.84rem; font-weight: 500; cursor: pointer; transition: var(--transition-fast); }
    .qa-btn:hover { background: var(--surface-subtle); }
    .qa-btn.accent { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); background: var(--accent); color: #fbf9f4; }
    .qa-btn.accent:hover { filter: brightness(0.96); }
    .qa-btn svg { width: 15px; height: 15px; }

    .dot { width: 8px; height: 8px; border-radius: 999px; background: var(--accent); flex-shrink: 0; }
    .dot.ok { background: var(--accent); } .dot.warn { background: #b07d18; } .dot.alert { background: var(--danger); }

    /* tiles */
    .tile { padding: 15px 16px; border: 1px solid rgba(27,20,14,0.12); border-radius: 8px; background: var(--surface-elevated); box-shadow: 0 1px 3px rgba(27,20,14,0.06); display: grid; grid-template-rows: auto minmax(0,1fr); gap: 12px; min-height: 0; }
    .tile.soft { background: var(--surface); }
    .tile-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .tile-h h2 { margin: 0; font-size: 1.04rem; font-weight: 650; color: var(--strong); line-height: 1.15; }
    .tile-h .sub { margin: 2px 0 0; font-size: 0.8rem; color: var(--muted); }
    .tile-body { min-height: 0; overflow: auto; display: grid; align-content: start; gap: 0; }
    .tile-body::-webkit-scrollbar { width: 0; }
    .add-btn { width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; border-radius: var(--radius-md); border: 1px solid var(--line); background: var(--surface-elevated); color: var(--strong); font-size: 1.1rem; line-height: 1; cursor: pointer; padding: 0; transition: var(--transition-fast); }
    .add-btn:hover { background: var(--surface-subtle); }
    .eyebrow { font-size: 0.66rem; letter-spacing: 0.11em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
    .link { font-size: 0.8rem; color: var(--muted); cursor: pointer; background: none; border: none; padding: 0; }
    .link:hover { color: var(--strong); }

    /* timers */
    .clock-block { display: flex; align-items: baseline; gap: 12px; padding-bottom: 14px; }
    .clock-big { font-size: 2.2rem; font-weight: 650; color: var(--strong); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; line-height: 0.95; }
    .clock-date { font-size: 0.82rem; color: var(--muted); }
    .timer-row { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 10px; padding: 11px 0; border-top: 1px solid var(--line-soft); }
    .timer-row:first-child { border-top: 0; }
    .timer-name { font-size: 0.9rem; color: var(--strong); font-weight: 500; }
    .timer-meta { font-size: 0.76rem; color: var(--muted); margin-top: 2px; }
    .timer-count { font-size: 1.18rem; font-weight: 600; color: var(--strong); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; text-align: right; min-width: 88px; }
    .timer-count.warn { color: #b07d18; } .timer-count.alert { color: var(--danger); }
    .timer-track { height: 3px; border-radius: 3px; background: var(--surface-subtle); overflow: hidden; margin-top: 6px; }
    .timer-fill { height: 100%; border-radius: 3px; background: var(--accent); transition: width 0.5s linear; }
    .timer-fill.warn { background: #b07d18; } .timer-fill.alert { background: var(--danger); }
    .pause-btn { width: 28px; height: 28px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--strong); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
    .pause-btn:hover { background: var(--surface-subtle); }
    .pause-btn svg { width: 13px; height: 13px; }

    /* mini rows */
    .row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 11px; padding: 9px 0; border-top: 1px solid var(--line-soft); }
    .row:first-child { border-top: 0; }
    .row.clickable { cursor: pointer; border-radius: 6px; margin: 0 -8px; padding: 9px 8px; transition: background 0.12s; }
    .row.clickable:hover { background: var(--surface-subtle); }
    .row-name { font-size: 0.88rem; color: var(--strong); font-weight: 500; }
    .row-meta { font-size: 0.76rem; color: var(--muted); margin-top: 1px; }
    .row-tag { font-size: 0.76rem; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--muted); }
    .row-tag.due { color: var(--danger); font-weight: 600; } .row-tag.soon { color: #b07d18; font-weight: 600; }

    /* quick log */
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { font-size: 0.76rem; color: var(--strong); padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
    .chip:hover { background: var(--surface-subtle); }
    .qlog-actions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
    .icon-btn { width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; border-radius: var(--radius-md); border: 1px solid var(--line); background: var(--surface-elevated); color: var(--strong); cursor: pointer; padding: 0; transition: var(--transition-fast); }
    .icon-btn.send { background: var(--accent); border-color: var(--accent); color: #fbf9f4; }
    .icon-btn:hover { filter: brightness(0.98); }
    .icon-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .icon-btn svg { width: 18px; height: 18px; }

    /* heatmap */
    .heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 11px); gap: 3px; width: max-content; }
    .hc { width: 11px; height: 11px; border-radius: 2px; }
    .heat-legend { display: flex; align-items: center; gap: 5px; font-size: 0.74rem; color: var(--muted); }
    .heat-legend .hc { width: 10px; height: 10px; }

    /* inventory stats */
    .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px 18px; }
    .stat .num { font-size: 1.7rem; font-weight: 650; color: var(--strong); font-variant-numeric: tabular-nums; line-height: 0.95; letter-spacing: -0.01em; }
    .stat .num.alert { color: var(--danger); }
    .stat .lbl { font-size: 0.78rem; color: var(--muted); margin-top: 4px; }
    .stat .delta { font-size: 0.74rem; color: var(--accent); font-weight: 500; margin-top: 1px; }
    .stat .delta.alert { color: var(--danger); }

    .subhead { display: flex; align-items: center; justify-content: space-between; margin: 0 0 2px; }
    .subhead .eyebrow { display: flex; align-items: center; gap: 7px; }
    .subhead .count { font-size: 0.74rem; color: var(--muted); font-variant-numeric: tabular-nums; }

    /* grid */
    .gridA { display: grid; grid-template-columns: 1.42fr 1.05fr 1.05fr; grid-template-rows: 1fr 1fr auto;
      grid-template-areas: "timers notebook quicklog" "timers notebook quicklog" "heat passage incub"; gap: 14px; min-height: 0; }
    .a-timers { grid-area: timers; } .a-passage { grid-area: passage; } .a-incub { grid-area: incub; }
    .a-quicklog { grid-area: quicklog; } .a-notebook { grid-area: notebook; }
    .a-heat { grid-area: heat; grid-template-rows: auto minmax(0,1fr); } .a-heat .tile-body { overflow: hidden; }
    .a-extra { grid-area: extra; }

    /* density variants (Tweaks) */
    .home.d-compact .gridA { gap: 10px; }
    .home.d-compact .tile { padding: 11px 13px; gap: 9px; }
    .home.d-compact .timer-row { padding: 8px 0; }
    .home.d-compact .row { padding: 7px 0; }
    .home.d-comfy .gridA { gap: 18px; }
    .home.d-comfy .tile { padding: 18px 20px; gap: 15px; }
    .home.d-comfy .timer-row { padding: 13px 0; }
    .home.d-comfy .row { padding: 11px 0; }

    /* modal */
    .overlay { position: fixed; inset: 0; background: rgba(23,18,14,0.42); display: flex; align-items: flex-start; justify-content: center; padding-top: 12vh; z-index: 100; }
    .modal { width: min(440px, calc(100vw - 40px)); background: var(--surface-elevated); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-modal); padding: 20px; }
    .modal h3 { margin: 0 0 14px; font-size: 1.1rem; color: var(--strong); }
    .field { display: grid; gap: 6px; margin-bottom: 12px; color: var(--strong); font-size: 0.9rem; font-weight: 500; }
    .field input { width: 100%; box-sizing: border-box; border: 1px solid var(--line); background: var(--surface); color: var(--text); padding: 9px 11px; border-radius: var(--radius-md); font-size: 0.92rem; }
    .field input:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
    .btn { padding: 8px 16px; border-radius: var(--radius-md); border: 1px solid var(--line); background: var(--surface); color: var(--strong); font-size: 0.9rem; font-weight: 500; cursor: pointer; transition: var(--transition-fast); }
    .btn:hover { background: var(--surface-subtle); }
    .btn.primary { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); background: var(--accent); color: #fbf9f4; }
    .btn.primary:hover { filter: brightness(0.96); }
    .templates { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }

    /* toast */
    .toast-wrap { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; align-items: center; z-index: 200; pointer-events: none; }
    .toast { display: flex; align-items: center; gap: 9px; padding: 10px 16px; border-radius: 999px; background: #1f211c; color: #f5f0e6; font-size: 0.86rem; box-shadow: var(--shadow-float); }
    .toast .dot { background: var(--accent); }
    .toast .dot.alert { background: #e0897a; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;
    const STORE_KEY = 'hikari-home-proto-v2';
    const LEGEND = ['#ebedf0','#9be9a8','#40c463','#30a14e','#216e39'];

    // ── helpers ───────────────────────────────────────────
    const pad = (n) => String(n).padStart(2, '0');
    function fmtHMS(sec) {
      sec = Math.max(0, Math.round(sec));
      const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
      return pad(h) + ':' + pad(m) + ':' + pad(s);
    }
    function clockStr(d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); }
    const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    function dateStr(d) { return DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear(); }
    function dueLabel(ms) {
      const d = ms - Date.now();
      if (d <= 0) return { tag: 'due now', cls: 'due', dot: 'alert' };
      const days = d / 86400000;
      if (days < 1) return { tag: 'due today', cls: 'due', dot: 'alert' };
      if (days < 2) return { tag: 'in 1 d', cls: 'soon', dot: 'warn' };
      return { tag: 'in ' + Math.round(days) + ' d', cls: '', dot: 'ok' };
    }

    // ── seed (timestamps anchored to first load) ──────────
    function seed() {
      const now = Date.now();
      return {
        timers: [
          { id: 't1', name: 'Trypsin digest — Plate 7', total: 300, endTs: now + 160000, remaining: 160, running: true },
          { id: 't2', name: 'Western blot block — Tray B', total: 1800, endTs: now + 725000, remaining: 725, running: true },
          { id: 't3', name: 'PCR extension — Tube 4', total: 5400, endTs: now + 2842000, remaining: 2842, running: true },
        ],
        finished: [
          { id: 'f1', name: 'Cell incubation — Plate 5', meta: '90 min · ended 12:40' },
          { id: 'f2', name: 'Gel run — agarose 1%', meta: '45 min · ended 11:05' },
        ],
        passages: [
          { id: 'p1', strain: 'HEK293T', passage: 14, intervalDays: 3, hood: 'Hood 2', dueTs: now + 5 * 3600000 },
          { id: 'p2', strain: 'HeLa', passage: 22, intervalDays: 4, hood: 'Hood 1', dueTs: now + 30 * 3600000 },
          { id: 'p3', strain: 'CHO-K1', passage: 8, intervalDays: 2, hood: 'Hood 2', dueTs: now + 3 * 86400000 },
          { id: 'p4', strain: 'Jurkat', passage: 31, intervalDays: 5, hood: 'Hood 3', dueTs: now + 5 * 86400000 },
        ],
        incubations: [
          { id: 'i1', name: 'Primary AB — anti-EGFR', temp: '4 °C', started: '18:40', ready: '08:00', soon: true },
          { id: 'i2', name: 'DH5α culture — pET28a', temp: '37 °C', started: '21:10', ready: '06:30', soon: false },
        ],
        logs: [
          { id: 'l1', text: 'Trypsinised Plate 7, split 1:6 into P15', time: '12:41' },
          { id: 'l2', text: 'Anti-pAKT lot running low — reorder', time: '09:54' },
        ],
      };
    }
    function load() {
      try {
        const r = JSON.parse(localStorage.getItem(STORE_KEY));
        if (r && r.timers) {
          const now = Date.now();
          // rebase stale demo data so the dashboard stays live across reloads
          r.timers = r.timers.map((t) => (t.running && t.endTs <= now) ? { ...t, endTs: now + t.total * 1000 } : t);
          if (Array.isArray(r.passages)) r.passages = r.passages.map((p) => (p.dueTs <= now ? { ...p, dueTs: now + p.intervalDays * 86400000 } : p));
          return r;
        }
      } catch (e) {}
      return seed();
    }

    // ── shared bits ───────────────────────────────────────
    function Icon({ d }) { return <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.1" strokeLinecap="round" strokeLinejoin="round"><path d={d}/></svg>; }
    function Heatmap({ weeks = 18, seed: sd = 3 }) {
      const cells = useMemo(() => {
        const out = []; let s = sd;
        for (let i = 0; i < weeks * 7; i++) { s = (s * 9301 + 49297) % 233280; const r = s / 233280; const lvl = r < 0.42 ? 0 : Math.floor(r * 5); out.push(LEGEND[Math.min(4, lvl)]); }
        return out;
      }, [weeks, sd]);
      return <div className="heat">{cells.map((c, i) => <div key={i} className="hc" style={{ background: c }} title="lab activity" />)}</div>;
    }

    // ── modal ─────────────────────────────────────────────
    function Modal({ title, onClose, children }) {
      useEffect(() => {
        const k = (e) => { if (e.key === 'Escape') onClose(); };
        window.addEventListener('keydown', k);
        return () => window.removeEventListener('keydown', k);
      }, [onClose]);
      return (
        <div className="overlay" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
          <div className="modal" role="dialog" aria-modal="true">
            <h3>{title}</h3>
            {children}
          </div>
        </div>
      );
    }

    // ── App ───────────────────────────────────────────────
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "accent": "#647255",
      "density": "regular",
      "warnMins": 5,
      "showFinished": true,
      "heatWeeks": 18
    }/*EDITMODE-END*/;

    function App() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const [data, setData] = useState(load);
      const [now, setNow] = useState(() => new Date());
      const [dialog, setDialog] = useState(null); // 'timer' | 'passage' | 'incub'
      const [toasts, setToasts] = useState([]);
      const toastId = useRef(0);

      // apply accent tweak to the token (cascades to modal + toast too)
      useEffect(() => { document.documentElement.style.setProperty('--accent', t.accent); }, [t.accent]);

      // persist
      useEffect(() => { try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch (e) {} }, [data]);

      // 1s ticker — clock + running timers
      useEffect(() => {
        const iv = setInterval(() => {
          setNow(new Date());
          setData((d) => {
            let changed = false; const fired = [];
            const timers = d.timers.map((t) => {
              if (!t.running) return t;
              const rem = Math.round((t.endTs - Date.now()) / 1000);
              if (rem <= 0) { fired.push(t); changed = true; return null; }
              return t;
            }).filter(Boolean);
            if (!changed) return d;
            const fin = fired.map((t) => ({ id: t.id, name: t.name, meta: Math.round(t.total / 60) + ' min · just finished' }));
            fired.forEach((t) => pushToast(t.name + ' finished', 'alert'));
            return { ...d, timers, finished: [...fin, ...d.finished] };
          });
        }, 1000);
        return () => clearInterval(iv);
      }, []);

      const pushToast = useCallback((text, kind) => {
        const id = ++toastId.current;
        setToasts((t) => [...t, { id, text, kind }]);
        setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 2600);
      }, []);

      // timer actions
      const togglePause = (id) => setData((d) => ({ ...d, timers: d.timers.map((t) => {
        if (t.id !== id) return t;
        if (t.running) return { ...t, running: false, remaining: Math.max(0, Math.round((t.endTs - Date.now()) / 1000)) };
        return { ...t, running: true, endTs: Date.now() + t.remaining * 1000 };
      }) }));
      const addTimer = (name, mins) => {
        const sec = Math.max(1, Math.round(mins * 60));
        setData((d) => ({ ...d, timers: [...d.timers, { id: 'u' + Date.now(), name, total: sec, endTs: Date.now() + sec * 1000, remaining: sec, running: true }] }));
        pushToast('Timer started · ' + name);
      };
      // passage actions
      const markPassaged = (id) => { setData((d) => ({ ...d, passages: d.passages.map((p) => p.id === id ? { ...p, passage: p.passage + 1, dueTs: Date.now() + p.intervalDays * 86400000 } : p) })); };
      const addPassage = (strain, interval, passage) => {
        setData((d) => ({ ...d, passages: [...d.passages, { id: 'u' + Date.now(), strain, passage: +passage, intervalDays: +interval, hood: 'Hood 2', dueTs: Date.now() + (+interval) * 86400000 }] }));
        pushToast('Added ' + strain + ' to passage reminders');
      };
      const addIncub = (name, temp, ready) => {
        setData((d) => ({ ...d, incubations: [...d.incubations, { id: 'u' + Date.now(), name, temp: temp || '37 °C', started: clockStr(new Date()).slice(0,5), ready: ready || '—', soon: false }] }));
        pushToast('Incubation added · ' + name);
      };
      // quick log

        pushToast(send ? 'Saved & sent to Assistant' : 'Bench note saved');
      };

      const runningCount = data.timers.filter((t) => t.running).length;
      const dueToday = data.passages.filter((p) => (p.dueTs - Date.now()) < 86400000).length;
      const soonest = data.timers.filter((t) => t.running).map((t) => Math.round((t.endTs - Date.now()) / 1000)).sort((a, b) => a - b)[0];

      return (
        <div className={'home' + (t.density === 'compact' ? ' d-compact' : t.density === 'comfy' ? ' d-comfy' : '')}>
          <TopDock active="home" toast={pushToast} />

            <TimersTile data={data} now={now} onToggle={togglePause} onAdd={() => setDialog('timer')} warnSec={t.warnMins * 60} showFinished={t.showFinished} />

            <QuickLogTile onSave={saveLog} lastLog={data.logs[0]} />
            <IncubTile incubations={data.incubations} onAdd={() => setDialog('incub')} />
            <NotebookTile toast={pushToast} />
            <HeatTile weeks={t.heatWeeks} />
          </div>

          {dialog === 'timer' && <StartTimerDialog onClose={() => setDialog(null)} onAdd={addTimer} />}
          {dialog === 'passage' && <AddPassageDialog onClose={() => setDialog(null)} onAdd={addPassage} />}
          {dialog === 'incub' && <AddIncubDialog onClose={() => setDialog(null)} onAdd={addIncub} />}

          <div className="toast-wrap">
            {toasts.map((t) => <div className="toast" key={t.id}><span className={'dot ' + (t.kind || 'ok')} />{t.text}</div>)}
          </div>

          <TweaksPanel>
            <TweakSection label="Layout" />
            <TweakRadio label="Density" value={t.density} options={['compact', 'regular', 'comfy']} onChange={(v) => setTweak('density', v)} />
            <TweakSlider label="Heatmap weeks" value={t.heatWeeks} min={10} max={26} step={1} unit=" wk" onChange={(v) => setTweak('heatWeeks', v)} />
            <TweakSection label="Timers" />
            <TweakSlider label="Amber under" value={t.warnMins} min={1} max={15} step={1} unit=" min" onChange={(v) => setTweak('warnMins', v)} />
            <TweakToggle label="Show finished today" value={t.showFinished} onChange={(v) => setTweak('showFinished', v)} />
            <TweakSection label="Theme" />
            <TweakColor label="Accent" value={t.accent} options={['#647255', '#4a6178', '#a05a3f', '#5a5a8c']} onChange={(v) => setTweak('accent', v)} />
          </TweaksPanel>
        </div>
      );

    function TimerRow({ t, now, onToggle, warnSec = 300 }) {
      const rem = t.running ? Math.max(0, Math.round((t.endTs - Date.now()) / 1000)) : t.remaining;
      const cls = rem < 60 ? 'alert' : rem < warnSec ? 'warn' : '';
      const pct = Math.max(2, Math.min(100, (1 - rem / t.total) * 100));
      const startedMin = Math.round(t.total / 60);
      return (
        <div className="timer-row">
          <div>
            <div className="timer-name">{t.name}</div>
            <div className="timer-meta">{startedMin} min total{!t.running ? ' · paused' : ''}</div>
            <div className="timer-track"><div className={'timer-fill ' + cls} style={{ width: pct + '%' }} /></div>
          </div>
          <button className="pause-btn" onClick={() => onToggle(t.id)} title={t.running ? 'Pause' : 'Resume'}>

      );

      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
