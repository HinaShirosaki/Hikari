<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pinned-top scrollable rail</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; color: #2b2b2b; background: #efece6; }

  /* the rail: fixed height + grid split = fixed row + scrolling row */
  .rail {
    width: 260px;
    height: 100vh;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr); /* minmax(0,1fr) is what lets the list shrink & scroll */
    background: #f7f5f1;
    border-right: 1px solid #d9d4cb;
    overflow: hidden;                        /* rail itself never scrolls */
  }

  /* pinned top — never scrolls. pads right by scrollbar width so its edge lines up with the list */
  .rail__top {
    padding: 14px calc(16px + var(--bar)) 12px 16px;
    border-bottom: 1px solid #e4e0d8;
  }
  .rail__top .title { font-weight: 700; font-size: 15px; }
  .rail__top button {
    margin-top: 10px; width: 100%; padding: 8px 10px; text-align: left;
    border: 1px solid #d9d4cb; border-radius: 8px; background: #fff; cursor: pointer; font: inherit;
  }

  /* scrolling list — the only scroller. padding-right insets text off the bar; bar sits on the border */
  .rail__list {
    --bar: 8px;
    overflow-y: auto;
    padding: 8px 16px 8px 16px;
    scrollbar-gutter: stable;               /* reserve the bar's width even when idle */
  }
  /* real 8px bar so scrollbar-gutter reserves real space (mimics the app) */
  .rail__list::-webkit-scrollbar { width: 8px; }
  .rail__list::-webkit-scrollbar-thumb { background: rgba(120,113,104,.28); border-radius: 4px; }

  .row {
    padding: 8px 10px; border-radius: 8px; cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .row:hover { background: #ece8e1; }
  .row.active { background: #e3ddd2; font-weight: 600; }

  .stage { position: fixed; left: 260px; top: 0; right: 0; bottom: 0;
           display: grid; place-items: center; color: #8a8378; }
</style>
</head>
<body>
  <aside class="rail" style="--bar: 8px;">
    <div class="rail__top">
      <div class="title">Codex</div>
      <button>＋ New task</button>
    </div>
    <nav class="rail__list" id="list"></nav>
  </aside>

  <div class="stage">← fixed header stays put; list scrolls, bar hugs the divider</div>

  <script>
    // fill with enough items to force a scrollbar
    const list = document.getElementById('list');
    for (let i = 1; i <= 60; i++) {
      const a = document.createElement('div');
      a.className = 'row' + (i === 3 ? ' active' : '');
      a.textContent = 'Simplify setup and analysis #' + i;
      list.appendChild(a);
    }
  </script>
</body>
</html>
