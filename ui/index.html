<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pLannotate Electron</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="background-grid" aria-hidden="true"></div>
    <main class="shell">
      <header class="hero">
        <h1>pLannotate Desktop</h1>
        <p>JavaScript/Electron rewrite of the pLannotate annotation workflow.</p>
      </header>

      <section class="controls card">
        <div class="row">
          <div class="db-status" id="dbStatus">Checking BLAST databases...</div>
          <button id="setupDbBtn" class="secondary">Setup Databases</button>
          <button id="importDbArchiveBtn" class="secondary">Import DB Archive</button>
          <button id="importDbFolderBtn" class="secondary">Import DB Folder</button>
        </div>

        <div class="mode-switch" role="tablist" aria-label="Input mode">
          <button id="modeFile" class="mode active" data-mode="file">FASTA/GenBank File</button>
          <button id="modeText" class="mode" data-mode="text">Sequence Text</button>
        </div>

        <div id="fileInputPanel" class="input-panel active">
          <div class="row">
            <button id="pickFileBtn">Choose Input File</button>
            <span id="pickedFile" class="muted">No file selected</span>
          </div>
        </div>

        <div id="textInputPanel" class="input-panel">
          <label for="sequenceInput">DNA sequence</label>
          <textarea id="sequenceInput" rows="8" placeholder="Paste sequence here"></textarea>
        </div>

        <div class="row options">
          <label><input id="linearOption" type="checkbox" /> Linear annotation</label>
          <label><input id="detailedOption" type="checkbox" /> Detailed annotation</label>
        </div>

        <div class="row">
          <button id="annotateBtn" class="primary">Annotate</button>
          <span id="runStatus" class="muted">Idle</span>
        </div>

        <div class="row exports">
          <button id="exportGbkBtn" class="secondary" disabled>Export GenBank</button>
          <button id="exportCsvBtn" class="secondary" disabled>Export CSV</button>
        </div>
      </section>

      <section class="results-grid">
        <section class="card map-card">
          <div class="card-head">
            <h2>Plasmid Map</h2>
            <span id="mapMeta" class="muted"></span>
          </div>
          <p class="map-help">Hover mouse for info, click and drag to pan, scroll wheel to zoom.</p>
          <div id="mapContainer" class="map-container"></div>
        </section>

        <section class="card table-card">
          <div class="card-head">
            <h2>Features</h2>
            <span id="hitCount" class="muted">0 hits</span>
          </div>
          <div class="table-wrap">
            <table id="resultsTable">
              <thead>
                <tr>
                  <th>Feature</th>
                  <th>Type</th>
                  <th>% Identity</th>
                  <th>% Match</th>
                  <th>Database</th>
                  <th>Description</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </section>
      </section>
    </main>

    <script type="module" src="renderer.js"></script>
  </body>
</html>
