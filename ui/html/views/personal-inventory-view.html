<section id="personal-inventory-view" class="view">
      <div class="panel">
        <div class="inventory-toolbar">
          <h2>Inventory</h2>
          <button id="inventory-add-container-btn" type="button" class="primary-btn">Add Container</button>
        </div>
        <form id="inventory-add-container-form" class="form-grid inventory-add-form" hidden>
          <label>
            Container Name
            <input id="inventory-add-container-name" placeholder="e.g. Box A" required />
          </label>
          <label>
            Location
            <select id="inventory-add-container-location" required>
              <option value="">Select location</option>
            </select>
          </label>
          <label>
            Type
            <select id="inventory-add-container-type">
              <option value="box81">81-well cube box</option>
              <option value="single">Single container (tube/bottle)</option>
            </select>
          </label>
          <div class="form-actions">
            <button type="submit" class="primary-btn">Save Container</button>
            <button id="inventory-add-container-cancel" type="button" class="ghost-btn">Cancel</button>
          </div>
        </form>
        <div id="inventory-sections" class="inventory-sections"></div>
      </div>
      <div id="container-detail" class="panel" hidden>
        <h3 id="container-title"></h3>
        <p id="container-detail-note" class="small-note">9 x 9 box (81 wells). Click each well to edit content.</p>
        <div id="well-grid" class="well-grid"></div>
        <div id="single-container-editor" class="stack-form" hidden>
          <label>
            Container Content
            <textarea id="single-container-content" rows="4" placeholder="Describe content in tube or bottle"></textarea>
          </label>
          <button id="single-container-save-btn" type="button" class="primary-btn">Save Content</button>
        </div>
      </div>
    </section>
