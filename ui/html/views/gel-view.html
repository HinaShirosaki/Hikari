<section id="gel-view" class="view">
      <div class="gel-workspace left-rail-template">
        <div class="gel-setup-panel app-left-rail left-rail-template__rail" data-sync-left-rail>
          <details id="gel-browser-panel" class="gel-browser-panel">
            <summary class="gel-browser-summary">
              <span>Existing Gels</span>
              <span id="gel-browser-count" class="small-note">0</span>
            </summary>
            <div class="gel-browser-body">
              <label>
                Search Gels
                <input id="gel-search" placeholder="Search saved gels" />
              </label>
              <div id="gel-list" class="gel-browser-list"></div>
            </div>
          </details>
          <h3>Setup</h3>
          <form id="gel-form" class="form-grid">
            <input type="hidden" id="gel-id" />
            <label>
              Gel Name
              <input id="gel-name" required placeholder="e.g. WB_RUN_2026_02_19" />
            </label>
            <label>
              Analysis Type
              <select id="gel-type">
                <option value="sds-page">SDS-PAGE</option>
                <option value="western">Western Blot</option>
                <option value="agarose">DNA/RNA Agarose</option>
              </select>
            </label>
            <label>
              Gel Image
              <input id="gel-image-file" class="gel-wide-field" type="file" accept="image/*" />
            </label>
            <label>
              Ladder Lane (1-based)
              <input id="gel-ladder-lane" type="number" min="1" step="1" value="1" />
            </label>
            <label>
              Normalization
              <select id="gel-normalization">
                <option value="none">None</option>
                <option value="total-lane">Total Lane Intensity</option>
              </select>
            </label>
            <label class="gel-slider-field">
              Denoise Strength
              <input id="gel-denoise-strength" type="range" min="0" max="100" step="1" value="35" />
              <span id="gel-denoise-strength-value" class="small-note">35%</span>
            </label>
            <label class="gel-slider-field">
              Contrast Boost
              <input id="gel-contrast-strength" type="range" min="0" max="220" step="1" value="100" />
              <span id="gel-contrast-strength-value" class="small-note">100%</span>
            </label>
            <div class="form-actions">
              <button type="button" id="gel-reset-overrides-btn" class="ghost-btn">Reset Manual Overrides</button>
              <span id="gel-override-status" class="small-note" hidden>Manual overrides: none</span>
            </div>
            <div id="gel-status" class="small-note"></div>
            <div class="form-actions">
              <button type="button" id="gel-run-btn" class="primary-btn">Analyze Gel</button>
              <button type="submit" class="primary-btn">Save Analysis</button>
              <button type="button" id="gel-cancel-btn" class="ghost-btn">Cancel Edit</button>
              <button type="button" id="gel-export-json-btn" class="ghost-btn">Export JSON</button>
              <button type="button" id="gel-export-csv-btn" class="ghost-btn">Export CSV</button>
            </div>
          </form>
        </div>

        <div class="gel-main left-rail-template__main">
          <div class="gel-main-stack">
            <div class="gel-main-grid">
              <div class="panel gel-viewer-panel">
                <h3>Gel Viewer</h3>
                <div class="gel-viewer-toolbar" role="toolbar" aria-label="Gel viewer tools">
                  <button type="button" id="gel-crop-mode-btn" class="ghost-btn gel-viewer-icon-btn gel-crop-mode-btn" aria-label="Start crop" title="Start crop" aria-pressed="false">
                    <svg class="gel-viewer-button-icon gel-crop-mode-icon gel-crop-mode-icon--start" viewBox="0 0 24 24" role="presentation" aria-hidden="true" focusable="false">
                      <path d="M6 3v13a2 2 0 0 0 2 2h13"></path>
                      <path d="M18 21V8a2 2 0 0 0-2-2H3"></path>
                    </svg>
                    <svg class="gel-viewer-button-icon gel-crop-mode-icon gel-crop-mode-icon--cancel" viewBox="0 0 24 24" role="presentation" aria-hidden="true" focusable="false">
                      <path d="m7 7 10 10"></path>
                      <path d="M17 7 7 17"></path>
                    </svg>
                  </button>
                  <button type="button" id="gel-apply-crop-btn" class="ghost-btn gel-viewer-icon-btn" aria-label="Apply crop" title="Apply crop" disabled hidden>
                    <svg class="gel-viewer-button-icon" viewBox="0 0 24 24" role="presentation" aria-hidden="true" focusable="false">
                      <path d="m5 12 4 4L19 6"></path>
                    </svg>
                  </button>
                  <button type="button" id="gel-reset-crop-btn" class="ghost-btn">Reset to Full Image</button>
                  <button type="button" id="gel-process-image-btn" class="ghost-btn">Process Image</button>
                  <button type="button" id="gel-view-original-btn" class="ghost-btn" aria-pressed="true">View Original</button>
                </div>
                <div id="gel-viewer-stage" class="gel-viewer-stage">
                  <div id="gel-lane-table-shell" class="gel-lane-table-shell" hidden></div>
                  <div id="gel-image-row" class="gel-image-row">
                    <div id="gel-lane-table-label-spacer" class="gel-lane-table-label-spacer" hidden aria-hidden="true"></div>
                    <div class="gel-canvas-shell">
                      <canvas id="gel-canvas"></canvas>
                      <img id="gel-cropper-image" alt="Gel cropper" />
                    </div>
                  </div>
                </div>
              </div>

              <div class="gel-side-rail">
                <section class="panel gel-manual-panel gel-tool-panel" aria-label="Gel tools">
                  <h3>Gel Tools</h3>
                  <div class="gel-tool-groups">
                    <details class="gel-tool-group" open>
                      <summary>Lane</summary>
                      <div class="gel-tool-actions">
                        <button type="button" id="gel-tool-dividers-btn" class="ghost-btn" title="Outermost dividers define the gel edges">Lane dividers</button>
                        <button type="button" id="gel-tool-ladder-lane-btn" class="ghost-btn">Ladder lane</button>
                        <button type="button" id="gel-tool-lane-vertices-btn" class="ghost-btn">Lane vertices</button>
                        <label class="small-note gel-tool-field">
                          Lanes
                          <input type="number" id="gel-expected-lane-count" min="2" max="40" step="1" placeholder="auto" />
                        </label>
                        <button type="button" id="gel-auto-detect-lanes-btn" class="ghost-btn">Auto-detect</button>
                      </div>
                    </details>

                    <details class="gel-tool-group" open>
                      <summary>Band</summary>
                      <div class="gel-tool-actions">
                        <button type="button" id="gel-tool-band-top-btn" class="ghost-btn">Band top</button>
                        <button type="button" id="gel-tool-band-bottom-btn" class="ghost-btn">Band bottom</button>
                        <button type="button" id="gel-lane-band-mode-btn" class="ghost-btn" aria-pressed="false">Per-lane band</button>
                      </div>
                    </details>

                    <details class="gel-tool-group" open>
                      <summary>Analysis</summary>
                      <div class="gel-tool-actions">
                        <label class="small-note gel-tool-field">
                          Ladder MW
                          <input id="gel-ladder-band-mw" type="number" min="0" step="0.1" placeholder="50 kDa" />
                        </label>
                        <button type="button" id="gel-add-table-btn" class="ghost-btn" disabled>Add table</button>
                        <button type="button" id="gel-measure-intensity-btn" class="ghost-btn">Measure</button>
                        <button type="button" id="gel-open-peak-editor-btn" class="ghost-btn">Peak editor</button>
                        <button type="button" id="gel-open-report-btn" class="ghost-btn" aria-haspopup="dialog" aria-controls="gel-report-overlay" aria-expanded="false" title="Open analysis report" disabled>Report</button>
                      </div>
                    </details>
                  </div>
                  <div class="gel-tool-footer">
                    <button type="button" id="gel-manual-next-btn" class="ghost-btn">Done</button>
                    <button type="button" id="gel-manual-reset-btn" class="ghost-btn">Reset</button>
                  </div>
                </section>

                <section id="gel-lane-profile-panel" class="panel gel-manual-panel gel-lane-profile-panel" hidden>
                  <div class="gel-lane-profile-head">
                    <div>
                      <h3>Lane Intensity</h3>
                      <p id="gel-lane-profile-caption" class="small-note">Load a gel image to inspect a lane profile.</p>
                    </div>
                    <label class="gel-lane-profile-picker">
                      Lane
                      <select id="gel-lane-profile-select" disabled>
                        <option value="">Select lane</option>
                      </select>
                    </label>
                  </div>
                  <div class="gel-lane-profile-chart-shell">
                    <svg id="gel-lane-profile-chart" class="gel-lane-profile-chart" viewBox="0 0 320 190" role="img" aria-label="Lane intensity profile"></svg>
                  </div>
                  <div id="gel-lane-profile-meta" class="gel-lane-profile-meta small-note"></div>
                </section>

              </div>
            </div>

            <div class="gel-secondary-panels">
              <section id="gel-cell-table-panel" class="panel gel-cell-table-panel" hidden>
                <header class="gel-cell-table-header">
                  <h3>Per-Cell Band Intensity</h3>
                  <label class="small-note gel-cell-snr-label">
                    SNR threshold:
                    <input type="number" id="gel-cell-snr-threshold" min="0" step="0.1" value="3" />
                  </label>
                </header>
                <div id="gel-cell-table-summary" class="small-note"></div>
                <div id="gel-cell-table-host" class="gel-cell-table-host"></div>
              </section>
            </div>
          </div>

          <div id="gel-report-overlay" class="app-dialog-overlay app-dialog-overlay--center" hidden>
            <section class="gel-report-dialog app-dialog-surface" role="dialog" aria-modal="true" aria-labelledby="gel-report-title" aria-describedby="gel-report-description">
              <header class="app-dialog-head gel-report-dialog-head">
                <div>
                  <h3 id="gel-report-title">Analysis Report</h3>
                  <p id="gel-report-description" class="small-note">Summary and complete data from the current gel analysis.</p>
                </div>
                <button type="button" id="gel-report-close-btn" class="app-dialog-close-btn" aria-label="Close analysis report" title="Close"><span aria-hidden="true">&times;</span></button>
              </header>
              <div class="gel-report-dialog-body">
                <div id="gel-report-summary" class="cards"></div>
              </div>
            </section>
          </div>

          <div id="gel-peak-editor-overlay" class="gel-peak-editor-overlay" hidden>
            <section class="gel-peak-editor-dialog" role="dialog" aria-modal="true" aria-labelledby="gel-peak-editor-title">
              <header class="gel-peak-editor-header">
                <div>
                  <h3 id="gel-peak-editor-title">Lane Peak Area</h3>
                  <div id="gel-peak-editor-summary" class="small-note"></div>
                </div>
                <button type="button" id="gel-peak-editor-close-btn" class="app-dialog-close-btn" aria-label="Close lane peak area dialog" title="Close"><span aria-hidden="true">&times;</span></button>
              </header>
              <div class="gel-peak-editor-toolbar" role="toolbar" aria-label="Peak area tools">
                <label class="gel-peak-editor-lane-picker small-note">
                  Lane
                  <select id="gel-peak-editor-lane-select"></select>
                </label>
                <div class="gel-peak-editor-modes">
                  <button type="button" id="gel-peak-editor-baseline-mode-btn" class="ghost-btn is-active" aria-pressed="true">Baseline</button>
                  <button type="button" id="gel-peak-editor-divider-mode-btn" class="ghost-btn" aria-pressed="false">Divider</button>
                </div>
                <button type="button" id="gel-peak-editor-clear-lane-btn" class="ghost-btn">Clear lane</button>
                <button type="button" id="gel-peak-editor-clear-all-btn" class="ghost-btn">Clear all</button>
              </div>
              <div class="gel-peak-editor-chart-shell">
                <svg id="gel-peak-editor-chart" class="gel-peak-editor-chart" viewBox="0 0 920 440" preserveAspectRatio="none" role="img" aria-label="Manual peak area editor"></svg>
              </div>
              <div id="gel-peak-editor-table" class="gel-peak-editor-table"></div>
            </section>
          </div>
        </div>
      </div>
    </section>
