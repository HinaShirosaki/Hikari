<section id="instrument-management-view" class="view">
      <div class="panel">
        <h3>Instruments</h3>
        <div id="instrument-list" class="list-table"></div>
      </div>

      <div id="instrument-detail-panel" class="panel" hidden>
        <div class="inline-row">
          <div>
            <h3 id="instrument-detail-title">Instrument</h3>
            <p id="instrument-detail-subtitle" class="small-note"></p>
          </div>
          <div class="inline-row calendar-toolbar">
            <div class="calendar-view-switch" role="group" aria-label="Calendar view mode">
              <button id="calendar-month-view-btn" class="ghost-btn" type="button">Month</button>
              <button id="calendar-week-view-btn" class="ghost-btn" type="button">Week</button>
            </div>
            <div class="inline-row">
              <button id="calendar-prev-btn" class="ghost-btn" type="button">Previous</button>
              <button id="calendar-today-btn" class="ghost-btn" type="button">Today</button>
              <button id="calendar-next-btn" class="ghost-btn" type="button">Next</button>
            </div>
          </div>
        </div>
        <h3 id="calendar-month-label"></h3>
        <div id="instrument-calendar" class="instrument-calendar"></div>

        <form id="reservation-form" class="stack-form">
          <input type="hidden" id="reservation-id" />
          <label>
            Reservation Title
            <input id="reservation-title" required placeholder="e.g. Sample run" />
          </label>
          <div class="form-grid">
            <label>
              Date
              <input id="reservation-date" type="date" required />
            </label>
            <label>
              Start Time
              <input id="reservation-start-time" type="time" />
            </label>
            <label>
              End Time
              <input id="reservation-end-time" type="time" />
            </label>
          </div>
          <label>
            Notes
            <textarea id="reservation-notes" rows="3" placeholder="Optional reservation details"></textarea>
          </label>
          <div class="form-actions">
            <button type="submit" class="primary-btn">Save Reservation</button>
            <button type="button" id="reservation-cancel-btn" class="ghost-btn">Cancel Edit</button>
          </div>
        </form>

        <div class="panel">
          <h3>Reservations</h3>
          <div id="reservation-list" class="cards"></div>
        </div>
      </div>

      <div class="panel">
        <h3>Create / Edit Instrument</h3>
        <form id="instrument-form" class="form-grid instrument-create-form">
          <input type="hidden" id="instrument-id" />
          <label>
            Instrument Name (Required)
            <input id="instrument-name" required />
          </label>
          <label>
            Nickname (Optional)
            <input id="instrument-nickname" />
          </label>
          <div class="form-actions instrument-create-actions">
            <button type="submit" class="primary-btn">Save Instrument</button>
            <button type="button" id="instrument-cancel-btn" class="ghost-btn">Cancel Edit</button>
          </div>
        </form>
      </div>
    </section>
