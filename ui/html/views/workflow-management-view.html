<section id="workflow-management-view" class="view">
      <div class="workflow-editor-layout left-rail-template">
        <aside class="workflow-editor-sidebar app-left-rail left-rail-template__rail left-rail-template__rail--pinned" data-sync-left-rail>
          <div class="workflow-editor-sidebar-pinned left-rail-template__pinned">
            <div id="workflow-entry-panel" class="workflow-entry-panel app-left-rail-section">
              <h3 class="workflow-navigation-title">Workflow Templates</h3>
              <button type="button" id="workflow-entry-template-btn" class="ghost-btn workflow-entry-template-icon-btn" aria-label="Template editor" data-hover-caption="Template editor">
                <svg viewBox="0 0 24 24" role="presentation" aria-hidden="true" focusable="false">
                  <path d="M6 3.75h8l4 4v12.5H6Z"></path>
                  <path d="M14 3.75v4h4"></path>
                  <path d="M9 12h6M9 15.5h6"></path>
                </svg>
                <span class="sr-only">Template editor</span>
              </button>
              <button type="button" id="workflow-entry-back-btn" class="workflow-entry-back-icon-btn" aria-label="Back to Home" data-hover-caption="Back to Home" hidden>
                <svg viewBox="0 0 24 24" role="presentation" aria-hidden="true" focusable="false">
                  <path d="M19 12H5M11 6l-6 6 6 6"></path>
                </svg>
                <span class="sr-only">Back to Home</span>
              </button>
              <span class="workflow-editor-title">Template</span>
              <div class="form-actions workflow-template-actions">
                <button type="button" id="workflow-save-template-btn" class="primary-btn workflow-template-action-icon-btn" aria-label="Save Current Graph" data-hover-caption="Save current graph">
                  <svg viewBox="0 0 24 24" role="presentation" aria-hidden="true" focusable="false">
                    <path d="M5 4h12l2 2v14H5Z"></path>
                    <path d="M8 4v6h8V4M8 16h8"></path>
                  </svg>
                  <span class="sr-only">Save Current Graph</span>
                </button>
                <button type="button" id="workflow-template-cancel-btn" class="ghost-btn workflow-template-action-icon-btn" aria-label="Cancel" data-hover-caption="Cancel">
                  <svg viewBox="0 0 24 24" role="presentation" aria-hidden="true" focusable="false">
                    <path d="M6 6l12 12M18 6 6 18"></path>
                  </svg>
                  <span class="sr-only">Cancel</span>
                </button>
              </div>
            </div>
            <div class="workflow-list-panel workflow-navigation-search" hidden>
              <label>
                <span class="sr-only">Search workflow templates</span>
                <input id="workflow-search" type="search" placeholder="Search templates..." aria-controls="workflow-list" />
              </label>
            </div>
          </div>

          <div class="workflow-editor-sidebar-scroll left-rail-template__scroll">
          <div class="workflow-list-panel app-left-rail-section" hidden>
            <div id="workflow-list" class="workflow-list app-left-rail-list"></div>
          </div>

          <div class="workflow-template-editor-panel app-left-rail-section" hidden>
            <label>
              Template name
              <input id="workflow-template-name" placeholder="Name your template" />
            </label>
            <label>
              Description
              <textarea id="workflow-template-description" rows="2" placeholder="Optional notes"></textarea>
            </label>
          </div>

          <div class="workflow-template-list-panel app-left-rail-section" hidden>
            <h3>Saved Templates</h3>
            <div id="workflow-template-list" class="workflow-list app-left-rail-list"></div>
          </div>

          <div class="workflow-block-composer-panel app-left-rail-section" hidden>
            <div class="form-grid workflow-grid workflow-block-grid">
              <fieldset id="workflow-block-type" class="workflow-block-type-switch">
                <legend class="sr-only">Block Type</legend>
                <div class="workflow-block-type-options">
                  <label class="workflow-block-type-option">
                    <input type="radio" name="workflow-block-type-option" value="protocol" checked />
                    <span>Protocol</span>
                  </label>
                  <label class="workflow-block-type-option">
                    <input type="radio" name="workflow-block-type-option" value="text" />
                    <span>Plain Text</span>
                  </label>
                </div>
              </fieldset>
              <div id="workflow-block-protocol-field" class="workflow-block-protocol-picker">
                <label id="workflow-block-protocol-search-field">
                  <span class="sr-only">Search &amp; Select Protocol</span>
                  <input id="workflow-block-protocol-search" type="search" placeholder="Search protocols..." autocomplete="off" aria-controls="workflow-block-protocol-search-results" />
                </label>
                <div id="workflow-block-protocol-search-results" class="workflow-block-protocol-search-results" role="listbox" aria-label="Matching protocols"></div>
                <select id="workflow-block-protocol" hidden aria-hidden="true" tabindex="-1">
                  <option value="">Select protocol</option>
                </select>
              </div>
              <label id="workflow-block-text-field" hidden>
                Plain Text
                <input id="workflow-block-text" placeholder="e.g. Incubate at room temperature for 10 minutes" />
              </label>
              <div class="form-actions workflow-inline-actions">
                <button type="button" id="workflow-block-add-btn" class="primary-btn">Add Protocol Block</button>
              </div>
            </div>
          </div>

          <div class="workflow-editor-panel workflow-sidebar-editor-panel app-left-rail-section" hidden>
            <form id="workflow-form" class="stack-form">
              <input type="hidden" id="workflow-id" />
              <label>
                Workflow Name
                <input id="workflow-name" required placeholder="e.g. Antibody purification pipeline" />
              </label>
              <label>
                Description
                <textarea id="workflow-description" rows="3" placeholder="Optional notes about this workflow"></textarea>
              </label>
              <label id="workflow-project-field">
                Linked Project
                <select id="workflow-project">
                  <option value="">Select project</option>
                </select>
              </label>
              <label id="workflow-notebook-pages-field">
                Linked Notebook Pages (optional)
                <select id="workflow-notebook-pages" multiple size="6"></select>
              </label>
              <div class="form-actions">
                <button type="submit" class="primary-btn">Save Workflow</button>
                <button type="button" id="workflow-cancel-btn" class="ghost-btn">Cancel Edit</button>
              </div>
            </form>
          </div>
          </div>
        </aside>

        <div class="workflow-editor-main left-rail-template__main">
          <div class="panel workflow-list-panel" hidden>
            <div class="workflow-execution-header">
              <div class="workflow-execution-copy">
                <h3 id="workflow-execution-title">Select a workflow template</h3>
              </div>
              <div class="workflow-execution-actions">
                <button type="button" id="workflow-add-run-btn" class="primary-btn workflow-execution-icon-btn" aria-label="Add workflow" data-hover-caption="Add workflow">
                  <svg viewBox="0 0 24 24" role="presentation" aria-hidden="true" focusable="false">
                    <path d="M12 5v14M5 12h14"></path>
                  </svg>
                  <span class="sr-only">Add workflow</span>
                </button>
                <button type="button" id="workflow-delete-run-btn" class="danger-btn workflow-execution-icon-btn" aria-label="Delete workflow" data-hover-caption="Delete workflow">
                  <svg viewBox="0 0 24 24" role="presentation" aria-hidden="true" focusable="false">
                    <path d="M4.5 7h15M9 3.5h6l1 3.5H8zM7 7l.75 13.5h8.5L17 7M10 10.5v6M14 10.5v6"></path>
                  </svg>
                  <span class="sr-only">Delete workflow</span>
                </button>
              </div>
            </div>
            <div id="workflow-execution-board" class="workflow-execution-board"></div>
          </div>
          <div class="panel workflow-editor-panel workflow-main-editor-panel" hidden>
            <h3>Graph Editor</h3>
            <div id="workflow-graph-canvas" class="workflow-graph-canvas">
              <div id="workflow-graph-board" class="workflow-graph-board">
                <svg id="workflow-graph-svg" class="workflow-graph-svg" aria-hidden="true"></svg>
                <div id="workflow-graph-selection" class="workflow-graph-selection" hidden></div>
                <div id="workflow-graph-nodes" class="workflow-graph-nodes"></div>
              </div>
            </div>
            <div id="workflow-graph-context-menu" class="workflow-context-menu" hidden></div>
          </div>
        </div>
      </div>
    </section>
