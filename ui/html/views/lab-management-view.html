<section id="lab-management-view" class="view">
      <div class="panel">
        <h2>Members &amp; Collaborations</h2>
        <form id="member-form" class="form-grid">
          <input type="hidden" id="member-id" />
          <label>
            Name
            <input id="member-name" required />
          </label>
          <label>
            Institution Email
            <input id="member-institution-email" type="email" required />
          </label>
          <label>
            Position
            <input id="member-position" required />
          </label>
          <label>
            Hikari Email
            <input id="member-hikari-email" type="email" required />
          </label>
          <div class="form-actions">
            <button type="submit" class="primary-btn">Save Member</button>
            <button type="button" id="member-cancel-btn" class="ghost-btn">Cancel Edit</button>
          </div>
        </form>
      </div>
      <div id="member-cards" class="cards"></div>
      <div class="panel">
        <h2>Collaborations</h2>
        <div class="setting-grid">
          <section class="card setting-card">
            <h3>Send Hikari Email</h3>
            <form id="message-form" class="stack-form">
              <label>
                From (Hikari Email)
                <select id="message-from"></select>
              </label>
              <label>
                To (Hikari Email)
                <select id="message-to"></select>
              </label>
              <label>
                Subject
                <input id="message-subject" />
              </label>
              <label>
                Message
                <textarea id="message-body" rows="4"></textarea>
              </label>
              <button type="submit" class="primary-btn">Send Message</button>
            </form>
          </section>

          <section class="card setting-card">
            <h3>Check Hikari Email Inbox</h3>
            <label>
              Inbox For
              <select id="inbox-email"></select>
            </label>
            <div id="inbox-list" class="stack-form"></div>
            <div class="stack-form">
              <h4>Import Shared Protocol Link / JSON</h4>
              <label>
                Share Link
                <textarea id="protocol-link-input" rows="3" placeholder="Paste hikari://protocol-share/... or HIKARI_PROTOCOL_SHARE:... or JSON"></textarea>
              </label>
              <div class="form-actions">
                <button type="button" id="import-protocol-link-btn" class="ghost-btn">Import Link</button>
              </div>
              <p id="protocol-link-status" class="small-note">Paste a shared protocol link or protocol JSON, then click Import Link.</p>
            </div>
          </section>
        </div>
      </div>
    </section>
