<section id="sequence-viewer-view" class="view">
      <div class="sequence-viewer-shell">
        <section id="sequence-viewer-home-workspace" class="sequence-viewer-home-workspace">
          <div class="sequence-viewer-home-toolbar">
            <div class="sequence-viewer-home-nav-copy">
              <strong>Navigation</strong>
              <p class="small-note">Start a new sequence session or open an existing GBK/FASTA file.</p>
            </div>
            <div class="form-actions sequence-viewer-home-nav-actions">
              <button id="sequence-viewer-home-paste-btn" type="button" class="primary-btn">New</button>
              <button id="sequence-viewer-home-open-btn" type="button" class="ghost-btn">Open GBK/FASTA</button>
              <span id="sequence-viewer-home-status" class="small-note">Choose New or Open to continue.</span>
            </div>
            <input id="sequence-viewer-home-open-input" type="file" accept=".gbk,.gb,.gbff,.fasta,.fa,.fas,.fna,.fastq,.fq,.txt,.seq" hidden />
          </div>

          <div class="sequence-viewer-home-grid">
            <section class="plannotate-result-card sequence-viewer-library-card">
              <div class="plannotate-card-head">
                <h4>Sequence Library</h4>
              </div>
              <div class="sequence-viewer-library-switch" role="tablist" aria-label="Sequence library filter">
                <button id="sequence-viewer-library-filter-saved" class="sequence-viewer-library-switch-btn sequence-viewer-library-switch-btn-active" type="button">Saved</button>
                <button id="sequence-viewer-library-filter-temporary" class="sequence-viewer-library-switch-btn" type="button">Unsaved</button>
              </div>
              <div id="sequence-viewer-library-list" class="sequence-viewer-library-list">
                <p class="small-note">No sequence entries found.</p>
              </div>
            </section>

            <section class="plannotate-result-card sequence-viewer-preview-card">
              <div class="plannotate-card-head">
                <h4>Circular Plasmid Preview</h4>
              </div>
              <div id="sequence-viewer-preview-host" class="sequence-viewer-preview-host">
                <p class="small-note">Select a sequence in the library to preview.</p>
              </div>
            </section>
          </div>
        </section>
      </div>
    </section>
