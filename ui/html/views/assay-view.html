<section id="assay-view" class="view">
      <div class="assay-create-layout left-rail-template">
        <div class="assay-mode-create-panel assay-create-sidebar app-left-rail left-rail-template__rail" data-sync-left-rail>
          <details id="assay-browser-panel" class="assay-browser-panel">
            <summary class="assay-browser-summary">
              <span>Existing Assays</span>
              <span id="assay-browser-count" class="small-note">0</span>
            </summary>
            <div class="assay-browser-body">
              <label>
                Search Assays
                <input id="assay-search" placeholder="Search assay plates, projects, or notes" />
              </label>
              <div id="assay-list" class="assay-browser-list"></div>
            </div>
          </details>
          <form id="assay-form" class="form-grid assay-form-grid">
            <input type="hidden" id="assay-id" />
            <div class="assay-display-field">
              <span class="assay-display-label">Assay Number</span>
              <div id="assay-number-display" class="assay-display-value" aria-live="polite"></div>
            </div>
            <label>
              Assay Name
              <input id="assay-name" required placeholder="e.g. Cell viability run 2026-02-19" />
            </label>
            <label>
              Project
              <select id="assay-project">
                <option value="">Select project</option>
              </select>
            </label>
            <label>
              Plate Type
              <select id="assay-plate-type">
                <option value="6">6 well</option>
                <option value="12">12 well</option>
                <option value="24">24 well</option>
                <option value="48">48 well</option>
                <option value="96" selected>96 well</option>
                <option value="384">384 well</option>
                <option value="1536">1536 well</option>
              </select>
            </label>
            <div class="assay-axis-config-grid">
              <div class="assay-axis-switch">
                <span class="assay-display-label">Sample ID Axis</span>
                <div class="calendar-view-switch assay-mode-switch" role="group" aria-label="Sample ID axis switch">
                  <button type="button" id="assay-sample-axis-row-btn" class="ghost-btn calendar-view-active">Row</button>
                  <button type="button" id="assay-sample-axis-column-btn" class="ghost-btn">Column</button>
                </div>
                <select id="assay-sample-axis" hidden>
                  <option value="row" selected>Row</option>
                  <option value="column">Column</option>
                </select>
              </div>
              <div class="assay-axis-switch">
                <span class="assay-display-label">Conc. Axis</span>
                <div class="calendar-view-switch assay-mode-switch" role="group" aria-label="Concentration axis switch">
                  <button type="button" id="assay-concentration-axis-row-btn" class="ghost-btn">Row</button>
                  <button type="button" id="assay-concentration-axis-column-btn" class="ghost-btn calendar-view-active">Column</button>
                </div>
                <select id="assay-concentration-axis" hidden>
                  <option value="row">Row</option>
                  <option value="column" selected>Column</option>
                </select>
              </div>
            </div>
            <select id="assay-notebook-entry" hidden>
              <option value="">Not linked</option>
            </select>
            <div id="assay-plate-definition" class="small-note assay-form-note" hidden></div>
            <div id="assay-csv-status" class="small-note assay-form-note"></div>
            <div class="form-actions assay-form-actions">
              <button type="button" id="assay-export-template-btn" class="ghost-btn">Export CSV Template</button>
              <button type="button" id="assay-import-template-btn" class="ghost-btn">Import CSV</button>
              <input id="assay-import-file" type="file" accept=".csv,text/csv" hidden />
              <button type="submit" class="primary-btn">Save Assay</button>
              <button type="button" id="assay-cancel-btn" class="ghost-btn">Cancel Edit</button>
            </div>
          </form>
        </div>

        <div class="panel assay-mode-create-panel assay-create-preview-panel left-rail-template__main">
          <div class="form-actions">
            <div class="calendar-view-switch assay-mode-switch" role="group" aria-label="Plate edit field">
              <button type="button" id="assay-plate-field-sample-btn" class="ghost-btn calendar-view-active">Edit Sample ID</button>
              <button type="button" id="assay-plate-field-concentration-btn" class="ghost-btn" aria-label="Edit Concentration">Edit Conc.</button>
            </div>
            <label class="assay-conc-unit-field">
              Conc. unit
              <input
                type="text"
                id="assay-concentration-unit"
                class="assay-conc-unit-input"
                list="assay-concentration-unit-options"
                placeholder="e.g. nM"
                autocomplete="off"
              />
              <datalist id="assay-concentration-unit-options">
                <option value="fM"></option>
                <option value="pM"></option>
                <option value="nM"></option>
                <option value="µM"></option>
                <option value="mM"></option>
                <option value="M"></option>
              </datalist>
            </label>
            <label class="assay-conc-unit-field">
              Fill
              <select id="assay-fill-mode" class="assay-fill-mode-select">
                <option value="factor">Dilution &divide;</option>
                <option value="linear">Linear</option>
                <option value="log">Log</option>
              </select>
            </label>
            <input
              type="number"
              id="assay-dilution-factor"
              class="assay-conc-unit-input"
              min="0"
              step="any"
              placeholder="factor e.g. 10"
            />
            <button type="button" id="assay-dilution-fill-btn" class="ghost-btn">Fill</button>
            <button type="button" id="assay-clear-mappings-btn" class="ghost-btn">Clear All Mappings</button>
            <button type="button" id="assay-serial-dilution-btn" class="ghost-btn">Serial Dilution</button>
          </div>
          <div id="assay-layout-status" class="small-note"></div>
          <div id="assay-plate-preview" class="assay-plate-preview"></div>
        </div>
      </div>

      <div class="assay-results-layout assay-mode-results-panel left-rail-template" hidden>
        <div class="assay-results-sheet-panel assay-results-controls-panel app-left-rail left-rail-template__rail" data-sync-left-rail>
          <div class="assay-results-control-section">
            <label>
              Assay Plate
              <select id="assay-results-assay-select">
                <option value="">Select assay plate</option>
              </select>
            </label>
            <div class="form-actions assay-results-actions">
              <button type="button" id="assay-attach-result-file-btn" class="ghost-btn">Attach Result File</button>
              <input id="assay-result-file-input" type="file" accept=".csv,.xls,.xlsx,text/csv,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden />
              <button type="button" id="assay-save-results-btn" class="primary-btn">Save Results</button>
              <button type="button" id="assay-clear-results-btn" class="ghost-btn">Clear Results</button>
            </div>
            <div id="assay-active-assay-info" class="small-note"></div>
            <div id="assay-result-status" class="small-note"></div>
          </div>

          <div class="assay-results-control-section">
            <label>
              Analysis Method
              <select id="assay-analysis-method">
                <option value="grouped_summary" selected>Grouped Summary</option>
                <option value="nested_summary">Nested Summary</option>
                <option value="row_summary">Row Summary</option>
                <option value="column_summary">Column Summary</option>
                <option value="linear_regression">Linear Regression</option>
                <option value="ec50">EC50 (4PL Fit)</option>
                <option value="ic50">IC50 (4PL Fit)</option>
                <option value="survival">Survival %</option>
                <optgroup label="Standard curves to interpolate">
                  <option value="standard_curve_line">Line</option>
                  <option value="standard_curve_4pl_log_concentration">Sigmoidal, 4PL, X is log(concentration)</option>
                  <option value="standard_curve_4pl_concentration">Sigmoidal, 4PL, X is concentration</option>
                  <option value="standard_curve_5pl_log_concentration">Asymmetric Sigmoidal, 5PL, X is log(concentration)</option>
                  <option value="standard_curve_5pl_concentration">Asymmetric Sigmoidal, 5PL, X is concentration</option>
                  <option value="standard_curve_semilog_line">Semilog line</option>
                  <option value="standard_curve_hyperbola">Hyperbola (X is concentration)</option>
                  <option value="standard_curve_quadratic">Second order polynomial (quadratic)</option>
                  <option value="standard_curve_cubic">Third order polynomial (cubic)</option>
                  <option value="standard_curve_pade_11">Pade (1,1) approximant</option>
                </optgroup>
              </select>
            </label>
            <div class="assay-analysis-controls">
              <label>
                Row Groups (optional)
                <textarea id="assay-analysis-row-groups" rows="2" placeholder="Control: A,B; Treated: C,D"></textarea>
              </label>
              <label>
                Column Groups (optional)
                <textarea id="assay-analysis-column-groups" rows="2" placeholder="Early: 1,2; Late: 3,4"></textarea>
              </label>
              <label class="assay-analysis-checkbox">
                <input id="assay-analysis-error-bars" type="checkbox" />
                Show SD error bars (for Row/Column Summary)
              </label>
              <label>
                Replicate Group Name (optional)
                <input id="assay-analysis-group-name" placeholder="e.g. Control replicate" />
              </label>
              <div class="form-actions assay-analysis-group-actions">
                <button type="button" id="assay-analysis-add-row-group-btn" class="ghost-btn">Add Selected as Row Group</button>
                <button type="button" id="assay-analysis-add-column-group-btn" class="ghost-btn">Add Selected as Column Group</button>
                <button type="button" id="assay-analysis-clear-groups-btn" class="ghost-btn">Clear Groups</button>
              </div>
              <div id="assay-analysis-selection-status" class="small-note"></div>
            </div>
            <div class="form-actions assay-results-actions">
              <button type="button" id="assay-analyze-results-btn" class="ghost-btn">Analyze Results</button>
            </div>
            <div id="assay-analysis-summary" class="small-note"></div>
          </div>

          <div id="assay-chart-style-panel" class="assay-results-control-section" data-assay-chart-style-mount></div>
        </div>

        <div class="panel assay-results-analysis-panel assay-results-workspace left-rail-template__main">
          <div class="assay-results-table-stage">
            <div id="assay-result-table" class="assay-plate-preview"></div>
          </div>
          <div class="assay-results-output-stage">
            <div id="assay-analysis-table" class="list-table"></div>
          </div>
        </div>
      </div>

      <div id="assay-serial-dilution-overlay" class="assay-serial-dilution-overlay app-dialog-overlay app-dialog-overlay--top" hidden>
        <div class="assay-serial-dilution-dialog app-dialog-surface" role="dialog" aria-modal="true" aria-labelledby="assay-serial-dilution-title">
          <div class="assay-header-row assay-serial-dilution-head app-dialog-head">
            <h3 id="assay-serial-dilution-title">Serial Dilution</h3>
            <button type="button" id="assay-serial-dilution-close-btn" class="ghost-btn" aria-label="Close serial dilution dialog">Close</button>
          </div>
          <p class="small-note">Use the current mapped plate to calculate a constant final volume per well, with the last active dilution well discarding the final carryover volume.</p>
          <div class="assay-serial-dilution-controls">
            <label>
              Volume per well (uL)
              <input id="assay-serial-dilution-volume" type="number" min="0" step="0.1" value="100" />
            </label>
          </div>
          <div id="assay-serial-dilution-summary" class="small-note"></div>
          <div id="assay-serial-dilution-content" class="assay-serial-dilution-content"></div>
        </div>
      </div>

      <div id="assay-result-import-overlay" class="assay-result-import-overlay app-dialog-overlay app-dialog-overlay--top" hidden>
        <div class="assay-result-import-dialog app-dialog-surface" role="dialog" aria-modal="true" aria-labelledby="assay-result-import-title">
          <div class="assay-header-row assay-result-import-head app-dialog-head">
            <div>
              <h3 id="assay-result-import-title">Select Result Matrix</h3>
              <p id="assay-result-import-status" class="small-note"></p>
            </div>
            <button type="button" id="assay-result-import-close-btn" class="ghost-btn" aria-label="Close result import dialog">Close</button>
          </div>
          <div class="assay-result-import-body">
            <div id="assay-result-import-candidates" class="assay-result-import-candidates" role="listbox" aria-label="Detected result matrices"></div>
            <div id="assay-result-import-preview" class="assay-result-import-preview"></div>
          </div>
          <div class="form-actions assay-result-import-actions">
            <button type="button" id="assay-result-import-cancel-btn" class="ghost-btn">Cancel</button>
            <button type="button" id="assay-result-import-apply-btn" class="primary-btn">Use This Matrix</button>
          </div>
        </div>
      </div>
    </section>
