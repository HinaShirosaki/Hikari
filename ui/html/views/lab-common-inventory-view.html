<section id="lab-common-inventory-view" class="view">
      <div class="chemical-layout left-rail-template">
        <aside class="chemical-sidebar app-left-rail left-rail-template__rail" data-sync-left-rail>
          <div class="chemical-sidebar-stack">
            <section class="chemical-sidebar-section app-left-rail-section">
              <div class="chemical-quick-actions" aria-label="Chemical actions">
                <button type="button" id="chemical-open-add-btn" class="primary-btn chemical-action-icon-btn chemical-add-btn" aria-label="Add chemical" data-hover-caption="Add chemical">
                  <svg viewBox="0 0 24 24" role="presentation" aria-hidden="true" focusable="false">
                    <path d="M9 3h6"></path>
                    <path d="M10 3v5.5l-5 8.2A2.8 2.8 0 0 0 7.4 21h9.2a2.8 2.8 0 0 0 2.4-4.3l-5-8.2V3"></path>
                    <path d="M12 12v5"></path>
                    <path d="M9.5 14.5h5"></path>
                  </svg>
                  <span class="sr-only">Add chemical</span>
                </button>
                <button type="button" id="chemical-import-btn" class="ghost-btn chemical-action-icon-btn chemical-import-btn" aria-label="Import chemicals" data-hover-caption="Import chemicals">
                  <svg viewBox="0 0 24 24" role="presentation" aria-hidden="true" focusable="false">
                    <path d="M12 3v11"></path>
                    <path d="m7.5 8 4.5-5 4.5 5"></path>
                    <path d="M5 14v5h14v-5"></path>
                  </svg>
                  <span class="sr-only">Import chemicals</span>
                </button>
              </div>
              <input id="chemical-import-file" type="file" accept=".csv,.xls,.xlsx,text/csv,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden />
              <p id="chemical-import-status" class="small-note chemical-import-status" hidden></p>
              <label class="chemical-search-field">
                Search
                <input id="chemical-search" type="search" placeholder="Name, CAS, vendor, catalog, location" />
              </label>
            </section>

            <section class="chemical-sidebar-section app-left-rail-section">
              <label>
                Filter Location
                <select id="chemical-filter-location">
                  <option value="">All locations</option>
                </select>
              </label>
              <label>
                Sort By
                <select id="chemical-sort">
                  <option value="updated_desc">Updated (Newest)</option>
                  <option value="updated_asc">Updated (Oldest)</option>
                  <option value="name_asc">Name (A-Z)</option>
                  <option value="name_desc">Name (Z-A)</option>
                  <option value="location_asc">Location Number (Low-High)</option>
                  <option value="location_desc">Location Number (High-Low)</option>
                  <option value="expiration_asc">Expiration (Soonest)</option>
                  <option value="expiration_desc">Expiration (Latest)</option>
                </select>
              </label>
            </section>
          </div>
        </aside>

        <div class="chemical-main left-rail-template__main">
          <div class="chemical-list-panel">
            <div class="chemical-panel-head">
              <div class="chemical-panel-copy">
                <h2>Chemicals</h2>
                <p id="chemical-results-summary" class="small-note">Showing 0 chemicals.</p>
              </div>
            </div>

            <div id="chemical-list" class="list-table"></div>
          </div>

          <div id="chemical-detail-panel" class="chemical-detail-panel" hidden>
            <div class="chemical-panel-head">
              <h3 id="chemical-detail-title">Chemical Details</h3>
              <div class="chemical-detail-actions">
                <button type="button" id="chemical-detail-edit-btn" class="row-action-icon-btn" aria-label="Edit chemical" title="Open this chemical in the form for editing"><svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
                <button type="button" id="chemical-detail-delete-btn" class="row-action-icon-btn row-action-icon-btn-danger" aria-label="Delete chemical" title="Permanently delete this chemical"><svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v5"/><path d="M14 11v5"/></svg></button>
              </div>
            </div>
            <div id="chemical-detail-content" class="stack-form"></div>
          </div>
        </div>
      </div>

      <div id="chemical-dialog-overlay" class="chemical-dialog-overlay app-dialog-overlay app-dialog-overlay--center" hidden>
        <div class="chemical-dialog app-dialog-surface" role="dialog" aria-modal="true" aria-labelledby="chemical-dialog-title">
          <div class="chemical-dialog-head app-dialog-head">
            <div>
              <h3 id="chemical-dialog-title">Add Chemical</h3>
              <p class="small-note">Create or update a chemical record.</p>
            </div>
            <button type="button" id="chemical-dialog-close-btn" class="app-dialog-close-btn" aria-label="Close chemical dialog" data-hover-caption="Close"><svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
          </div>

          <form id="chemical-form" class="form-grid">
            <input type="hidden" id="chemical-id" />
            <label>
              Name (Required)
              <input id="chemical-name" required />
            </label>
            <label>
              CAS Number (Required)
              <input id="chemical-cas" required />
            </label>
            <label>
              Location (Required)
              <select id="chemical-location" required></select>
            </label>
            <label>
              Vendor
              <input id="chemical-vendor" />
            </label>
            <label>
              Catalog Number
              <input id="chemical-catalog-number" />
            </label>
            <label>
              Unit Size
              <input id="chemical-unit-size" />
            </label>
            <label>
              Price
              <input id="chemical-price" />
            </label>
            <label>
              Amount in Stock
              <input id="chemical-stock" />
            </label>
            <label class="chemical-form-field-wide">
              URL
              <input id="chemical-url" />
            </label>
            <label>
              Expiration Date
              <input id="chemical-expiration" type="date" />
            </label>
            <div class="form-actions chemical-form-actions">
              <button type="submit" class="primary-btn" title="Save this chemical to the inventory">Save Chemical</button>
              <button type="button" id="chemical-cancel-btn" class="ghost-btn" title="Discard changes and close the dialog">Cancel</button>
            </div>
          </form>
        </div>
      </div>

      <div class="panel" hidden>
        <h3>Blockchain Records</h3>
        <div id="inventory-blockchain-list" class="stack-form"></div>
      </div>
    </section>
