<section id="lab-common-inventory-view" class="view">
      <div class="panel">
        <h2>Chemicals</h2>
        <form id="chemical-form" class="form-grid">
          <input type="hidden" id="chemical-id" />
          <label>
            Name (Required)
            <input id="chemical-name" required />
          </label>
          <label>
            CAS Number (Required)
            <input id="chemical-cas" required />
          </label>
          <label>
            Location (Required)
            <select id="chemical-location" required></select>
          </label>
          <label>
            Vendor
            <input id="chemical-vendor" />
          </label>
          <label>
            Catalog Number
            <input id="chemical-catalog-number" />
          </label>
          <label>
            Unit Size
            <input id="chemical-unit-size" />
          </label>
          <label>
            Price
            <input id="chemical-price" />
          </label>
          <label>
            Amount in Stock
            <input id="chemical-stock" />
          </label>
          <label>
            URL
            <input id="chemical-url" />
          </label>
          <label>
            Expiration Date
            <input id="chemical-expiration" type="date" />
          </label>
          <div class="form-actions chemical-form-actions">
            <button type="submit" class="primary-btn">Save Chemical</button>
            <button type="button" id="chemical-cancel-btn" class="ghost-btn">Cancel Edit</button>
          </div>
        </form>
      </div>
      <div class="panel">
        <h3>Enana Sync Inbox</h3>
        <div class="inline-row chemical-inbox-row">
          <label>
            Inbox Email
            <select id="inventory-inbox-email"></select>
          </label>
          <button type="button" id="inventory-import-btn" class="ghost-btn">Import Chemical Update</button>
        </div>
        <p class="small-note">Pending inventory updates: <span id="inventory-pending-count">0</span></p>
      </div>
      <div class="panel">
        <h3>Chemical List</h3>
        <div class="form-grid">
          <label>
            Search
            <input id="chemical-search" placeholder="Name, CAS, vendor, catalog, location" />
          </label>
          <label>
            Filter Location
            <select id="chemical-filter-location">
              <option value="">All locations</option>
            </select>
          </label>
          <label>
            Sort By
            <select id="chemical-sort">
              <option value="updated_desc">Updated (Newest)</option>
              <option value="updated_asc">Updated (Oldest)</option>
              <option value="name_asc">Name (A-Z)</option>
              <option value="name_desc">Name (Z-A)</option>
              <option value="location_asc">Location Number (Low-High)</option>
              <option value="location_desc">Location Number (High-Low)</option>
              <option value="expiration_asc">Expiration (Soonest)</option>
              <option value="expiration_desc">Expiration (Latest)</option>
            </select>
          </label>
        </div>
        <div id="chemical-list" class="list-table"></div>
      </div>
      <div id="chemical-detail-panel" class="panel" hidden>
        <h3 id="chemical-detail-title">Chemical Details</h3>
        <div id="chemical-detail-content" class="stack-form"></div>
        <div class="card-actions">
          <button type="button" id="chemical-detail-edit-btn" class="ghost-btn">Edit</button>
          <button type="button" id="chemical-detail-delete-btn" class="danger-btn">Delete</button>
        </div>
      </div>
      <div class="panel">
        <h3>Blockchain Records</h3>
        <div id="inventory-blockchain-list" class="stack-form"></div>
      </div>
    </section>
