<section id="agent-view" class="view">
      <div class="agent-chat-layout left-rail-template">
        <aside class="agent-session-rail app-left-rail left-rail-template__rail" data-sync-left-rail>
          <div class="agent-session-panel">
            <div class="agent-session-toolbar">
              <div>
                <h3>Saved Chats</h3>
                <p id="agent-session-status" class="small-note">Set Storage Folder Path in Settings to save and browse agent chats.</p>
              </div>
              <button type="button" id="agent-new-chat-btn" class="ghost-btn agent-new-chat-btn" aria-label="New Chat" title="New Chat">
                <svg viewBox="0 0 24 24" role="presentation" aria-hidden="true">
                  <path d="M5 5.75A2.75 2.75 0 0 1 7.75 3h8.5A2.75 2.75 0 0 1 19 5.75v5.5A2.75 2.75 0 0 1 16.25 14H12l-4.15 3.2A.8.8 0 0 1 6.55 16.58V14A2.75 2.75 0 0 1 5 11.25v-5.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                  <path d="M12 6.75v3.5M10.25 8.5h3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
              </button>
            </div>
            <div id="agent-session-list" class="agent-session-list" aria-live="polite"></div>
          </div>
        </aside>

        <div class="panel agent-chat-panel left-rail-template__main">
          <div class="agent-chat-stage">
            <p id="agent-status" class="small-note agent-status-pill" hidden>Ready.</p>
            <div id="agent-developer-tools" class="agent-developer-tools" hidden>
              <div class="agent-developer-tools-actions">
                <button type="button" id="agent-dev-test-tools-btn" class="ghost-btn">Test All Tools</button>
                <span class="small-note">Developer mode only. Run the full smoke suite or target one tool with a manual message and inspect the raw result in chat.</span>
              </div>
              <div class="agent-developer-tool-grid">
                <label>
                  Tool
                  <select id="agent-dev-tool-select"></select>
                </label>
                <label class="agent-developer-tool-message">
                  Manual Test Message
                  <textarea id="agent-dev-tool-message" rows="3" placeholder="Enter a tool-directed test message."></textarea>
                </label>
                <div class="form-actions">
                  <button type="button" id="agent-dev-run-tool-btn" class="ghost-btn">Run Selected Tool</button>
                  <span id="agent-dev-tool-hint" class="small-note"></span>
                </div>
              </div>
            </div>
            <div id="agent-dev-response-simulator" class="agent-dev-response-simulator" hidden>
              <div class="agent-dev-response-header">
                <div>
                  <strong>LLM Response Simulator</strong>
                  <span id="agent-dev-response-summary" class="small-note">Developer mode</span>
                </div>
                <button type="button" id="agent-dev-response-fold-btn" class="ghost-btn" aria-expanded="true">Fold</button>
              </div>
              <div id="agent-dev-response-body" class="agent-dev-response-body">
                <label class="agent-dev-context-field">
                  Agent Visible Context
                  <textarea id="agent-dev-visible-context" rows="10" readonly></textarea>
                </label>
                <label class="agent-dev-context-field">
                  Typed LLM Response
                  <textarea id="agent-dev-mock-response" rows="6" placeholder="Type the exact assistant response to inject."></textarea>
                </label>
                <div class="agent-dev-response-actions">
                  <button type="button" id="agent-dev-refresh-context-btn" class="ghost-btn">Refresh Context</button>
                  <button type="button" id="agent-dev-use-mock-response-btn" class="primary-btn">Use As Response</button>
                  <span id="agent-dev-response-hint" class="small-note"></span>
                </div>
              </div>
            </div>
            <div class="agent-conversation-shell">
              <div class="agent-history-viewport">
                <div id="agent-chat-history" class="agent-chat-history" aria-live="polite"></div>
                <button type="button" id="agent-scroll-to-bottom-btn" class="ghost-btn agent-scroll-to-bottom-btn" hidden>Jump to Latest</button>
              </div>
              <div class="agent-composer-shell">
                <div class="stack-form agent-composer-card">
                  <input id="agent-attachment-input" type="file" multiple hidden />
                  <label class="agent-composer-label">
                    <span>Message</span>
                    <textarea id="agent-message-input" rows="3" placeholder="Ask for protocol guidance, inventory checks, literature-grounded suggestions, or planning support."></textarea>
                  </label>
                  <div id="agent-attachment-list" class="agent-attachment-list" hidden></div>
                  <div class="agent-composer-toolbar">
                    <div class="agent-composer-toolbar-start">
                      <button type="button" id="agent-attach-btn" class="ghost-btn agent-attach-btn" aria-label="Attach photos or files" title="Attach photos or files">+</button>
                      <label class="agent-composer-project agent-composer-project-inline">
                        <span class="sr-only">Project Scope</span>
                        <select id="agent-project-select" aria-label="Project Scope">
                          <option value="">All projects</option>
                        </select>
                      </label>
                    </div>
                    <div class="form-actions agent-composer-actions">
                      <button type="button" id="agent-deep-research-toggle-btn" class="ghost-btn">Deep Research: Off</button>
                      <button type="button" id="agent-send-btn" class="primary-btn">Send</button>
                      <button type="button" id="agent-stop-btn" class="danger-btn" hidden>Stop</button>
                      <button type="button" id="agent-clear-btn" class="ghost-btn">New Thread</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
