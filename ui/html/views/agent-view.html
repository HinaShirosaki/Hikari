<section id="agent-view" class="view">
      <div class="panel">
        <h2>Lab Assistant Agent</h2>
        <p class="small-note">Read-only agent loop: intake, context, plan, execute, verify, synthesize. Write actions are proposed only and require approval.</p>
        <p class="small-note">Set the API key in Settings, or provide <code>LLM_API_KEY</code> / <code>ENANA_LLM_API_KEY</code> in the app environment.</p>
        <div class="form-grid">
          <label>
            Project Scope (Optional)
            <select id="agent-project-select">
              <option value="">All projects</option>
            </select>
          </label>
          <label>
            Context Summary
            <input id="agent-context-summary" disabled />
          </label>
        </div>
      </div>

      <div class="panel agent-chat-panel">
        <div id="agent-chat-history" class="agent-chat-history" aria-live="polite"></div>
        <p id="agent-status" class="small-note">Ready.</p>
        <div class="stack-form">
          <label>
            Message
            <textarea id="agent-message-input" rows="4" placeholder="Ask for protocol guidance, inventory checks, literature-grounded suggestions, or planning support."></textarea>
          </label>
          <div class="form-actions">
            <button type="button" id="agent-send-btn" class="primary-btn">Send</button>
            <button type="button" id="agent-clear-btn" class="ghost-btn">Clear Chat</button>
          </div>
        </div>
      </div>
    </section>
