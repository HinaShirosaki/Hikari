<section id="agent-view" class="view">
      <div class="agent-chat-layout left-rail-template" data-left-rail-foldable="true">
        <aside id="agent-session-rail" class="agent-session-rail app-left-rail left-rail-template__rail left-rail-template__rail--pinned" data-sync-left-rail>
          <div class="agent-session-toolbar left-rail-template__pinned">
            <div class="agent-session-toolbar-copy">
              <p id="agent-session-status" class="small-note">Set Storage Folder Path in Settings to save and browse agent chats.</p>
            </div>
          </div>
          <div id="agent-session-list" class="agent-session-list left-rail-template__scroll folder-tree-template" aria-live="polite"></div>
          <div id="agent-session-context-menu" class="agent-session-context-menu" hidden>
            <button type="button" id="agent-context-new-folder" class="agent-session-context-item">New Folder</button>
            <button type="button" id="agent-context-rename-folder" class="agent-session-context-item" hidden>Rename Folder</button>
            <button type="button" id="agent-context-delete-folder" class="agent-session-context-item agent-session-context-item-danger" hidden>Delete Folder</button>
          </div>
        </aside>

        <div class="panel agent-chat-panel left-rail-template__main">
          <div class="agent-chat-stage">
            <div class="agent-conversation-shell is-empty-chat">
              <div class="agent-history-viewport">
                <div id="agent-chat-history" class="agent-chat-history" aria-live="polite"></div>
                <button type="button" id="agent-scroll-to-bottom-btn" class="ghost-btn agent-scroll-to-bottom-btn" hidden>Jump to Latest</button>
              </div>
              <div class="agent-composer-shell">
                <div id="agent-question-dock" class="agent-question-dock" aria-live="polite" hidden></div>
                <div class="stack-form agent-composer-card">
                  <input id="agent-attachment-input" type="file" multiple hidden />
                  <label class="agent-composer-label">
                    <span class="sr-only">Message</span>
                    <textarea id="agent-message-input" rows="3" placeholder="Ask Hikari…"></textarea>
                  </label>
                  <div id="agent-attachment-list" class="agent-attachment-list" hidden></div>
                  <div class="agent-composer-toolbar">
                    <div class="agent-composer-toolbar-start">
                      <button type="button" id="agent-attach-btn" class="ghost-btn agent-attach-btn" aria-label="Attach photos or files" title="Attach photos or files">+</button>
                      <label class="agent-composer-project agent-composer-project-inline">
                        <span class="sr-only">Project Scope</span>
                        <select id="agent-project-select" aria-label="Project Scope">
                          <option value="">All projects</option>
                        </select>
                      </label>
                    </div>
                    <div class="form-actions agent-composer-actions">
                      <button type="button" id="agent-send-btn" class="primary-btn agent-send-icon-btn" aria-label="Send message" title="Send message">
                        <svg class="agent-send-icon" viewBox="0 0 24 24" role="presentation" aria-hidden="true" focusable="false">
                          <path d="M12 19V5"></path>
                          <path d="m6.5 10.5 5.5-5.5 5.5 5.5"></path>
                        </svg>
                        <span class="sr-only">Send message</span>
                      </button>
                      <button type="button" id="agent-stop-btn" class="danger-btn" hidden>Stop</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div id="agent-review-overlay" class="agent-review-overlay app-dialog-overlay app-dialog-overlay--top" hidden>
              <section class="agent-review-dialog app-dialog-surface draft-review-dialog" role="dialog" aria-modal="true" aria-labelledby="agent-review-title">
                <header class="agent-review-dialog-header app-dialog-head">
                  <div>
                    <h3 id="agent-review-title">Review generated drafts</h3>
                  </div>
                  <button type="button" id="agent-review-close-btn" class="app-dialog-close-btn" aria-label="Close generated draft review dialog" title="Close"><span aria-hidden="true">&times;</span></button>
                </header>
                <div id="agent-review-track" class="agent-review-track" tabindex="0" aria-live="polite"></div>
                <footer class="agent-review-footer">
                  <button type="button" id="agent-review-prev-btn" class="ghost-btn" aria-label="Previous generated draft">Previous</button>
                  <span id="agent-review-page-label" class="small-note">1 / 1</span>
                  <button type="button" id="agent-review-next-btn" class="ghost-btn" aria-label="Next generated draft">Next</button>
                </footer>
              </section>
            </div>
          </div>
        </div>
      </div>
    </section>
