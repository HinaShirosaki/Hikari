<section id="papers-view" class="view">
      <div class="panel">
        <h2>Papers</h2>
        <form id="paper-form" class="stack-form">
          <label>
            Paper Title (Optional)
            <input id="paper-title" placeholder="Defaults to PDF filename" />
          </label>
          <label>
            PDF File
            <input id="paper-pdf" type="file" accept="application/pdf,.pdf" required />
          </label>
          <label>
            Link Type
            <select id="paper-link-type">
              <option value="project">Project</option>
              <option value="journal-club">Journal Club</option>
            </select>
          </label>
          <label>
            Link To
            <select id="paper-link-target">
              <option value="">Select target</option>
            </select>
          </label>
          <button type="submit" class="primary-btn">Upload Paper</button>
        </form>
      </div>

      <div class="panel">
        <h3>Journal Clubs</h3>
        <div class="stack-form">
          <label>
            Journal Club Name
            <input id="journal-club-name" placeholder="e.g. Weekly Biochem JC" />
          </label>
          <label>
            Description
            <input id="journal-club-description" placeholder="Optional description" />
          </label>
          <button type="button" id="journal-club-add-btn" class="ghost-btn">Add Journal Club</button>
        </div>
        <div id="journal-club-list" class="cards"></div>
      </div>

      <div class="panel">
        <h3>Uploaded Papers</h3>
        <p class="small-note">To summarize, configure LLM model + API endpoint/key in Setting.</p>
        <div id="paper-list" class="cards"></div>
      </div>

      <div class="panel">
        <h3>Project Library Q&A</h3>
        <div class="stack-form">
          <label>
            Project
            <select id="knowledge-project-select">
              <option value="">Select project</option>
            </select>
          </label>
          <label>
            Question
            <textarea id="knowledge-question" rows="3" placeholder="Ask about papers, protocols, and notebook notes in this project"></textarea>
          </label>
          <div class="form-actions">
            <button type="button" id="knowledge-ask-btn" class="primary-btn">Ask</button>
          </div>
          <div id="knowledge-answer" class="card"></div>
          <div id="knowledge-chat-history" class="stack-form"></div>
        </div>
      </div>
    </section>
