<section id="sample-registry-view" class="view">
      <div class="personal-inventory-layout left-rail-template">
        <aside class="inventory-rail-panel app-left-rail left-rail-template__rail left-rail-template__rail--pinned" data-sync-left-rail>
          <div class="inventory-rail-scroll left-rail-template__scroll">
            <div class="inventory-rail-stack app-left-rail-section">
              <div id="inventory-location-nav" class="inventory-location-nav"></div>
              <div id="inventory-container-context-menu" class="personal-inventory-context-menu" hidden></div>
            </div>
            <div id="inventory-summary-card" class="inventory-summary-card app-left-rail-section"></div>
          </div>
        </aside>

        <div class="panel inventory-main-panel left-rail-template__main">
          <div id="inventory-sections" class="inventory-sections"></div>
        </div>
      </div>

      <div id="inventory-add-container-overlay" class="inventory-add-container-overlay app-dialog-overlay app-dialog-overlay--center" hidden>
        <form
          id="inventory-add-container-form"
          class="form-grid inventory-add-form inventory-add-container-dialog app-dialog-surface"
          role="dialog"
          aria-modal="true"
          aria-labelledby="inventory-add-container-title"
        >
          <div class="app-dialog-head inventory-add-container-head">
            <div>
              <h3 id="inventory-add-container-title">Add Container</h3>
              <p id="inventory-add-container-note" class="small-note" hidden></p>
            </div>
            <button id="inventory-add-container-close" type="button" class="app-dialog-close-btn" aria-label="Close add container dialog" title="Close"><svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
          </div>
          <label>
            <span id="inventory-add-item-name-label">Container Name</span>
            <input id="inventory-add-container-name" placeholder="e.g. Box A" required />
          </label>
          <label>
            Location
            <select id="inventory-add-container-location" required>
              <option value="">Select location</option>
            </select>
          </label>
          <label id="inventory-add-container-type-field">
            Type
            <select id="inventory-add-container-type">
              <option value="box25">25-well grid box (5 × 5)</option>
              <option value="box49">49-well grid box (7 × 7)</option>
              <option value="box64">64-well grid box (8 × 8)</option>
              <option value="box81">81-well grid box</option>
              <option value="box100">100-well grid box (10 × 10)</option>
              <option value="customGrid">Custom grid box</option>
              <option value="plate96">96-well plate</option>
              <option value="single">Single container (tube/bottle)</option>
            </select>
          </label>
          <div id="inventory-add-container-grid-fields" class="inventory-custom-grid-fields" hidden>
            <label>
              Rows
              <input id="inventory-add-container-rows" type="number" min="1" max="24" step="1" value="9" />
            </label>
            <label>
              Columns
              <input id="inventory-add-container-cols" type="number" min="1" max="24" step="1" value="9" />
            </label>
            <p class="small-note inventory-custom-grid-note">Custom grid boxes reuse the same visual style as the 81-well box.</p>
          </div>
          <div class="form-actions">
            <button id="inventory-add-container-submit" type="submit" class="primary-btn">Save Container</button>
            <button id="inventory-add-container-cancel" type="button" class="ghost-btn">Cancel</button>
          </div>
        </form>
      </div>
    </section>
