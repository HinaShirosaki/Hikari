<section id="project-management-view" class="view">
      <div class="project-layout left-rail-template">
        <aside class="project-sidebar app-left-rail left-rail-template__rail" data-sync-left-rail>
          <div class="left-rail-template__stack">
            <section class="left-rail-template__section">
              <div class="project-sidebar-copy">
                <h2>Projects</h2>
                <p class="small-note">Select a project to review its workspace activity.</p>
              </div>
              <div id="project-list" class="project-rail-list"></div>
            </section>

            <section class="left-rail-template__section">
              <div class="project-sidebar-copy">
                <h3>Project Details</h3>
                <p class="small-note">Create a project or edit the selected project notes.</p>
              </div>
              <form id="project-form" class="stack-form">
                <input type="hidden" id="project-id" />
                <label>
                  Project Name
                  <input id="project-name" required />
                </label>
                <label>
                  Description
                  <textarea id="project-description" rows="3"></textarea>
                </label>
                <div class="form-actions">
                  <button type="submit" class="primary-btn">Save Project</button>
                  <button type="button" id="project-cancel-btn" class="ghost-btn">Cancel Edit</button>
                </div>
              </form>
            </section>
          </div>
        </aside>

        <div class="project-main left-rail-template__main">
          <div id="project-dashboard" class="project-dashboard"></div>
        </div>
      </div>
    </section>
