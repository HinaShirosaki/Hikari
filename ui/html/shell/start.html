<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enana</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="./vendor/cropperjs/cropper.min.css" />
  <link rel="stylesheet" href="./vendor/tabulator/tabulator.min.css" />
  <link rel="stylesheet" href="./vendor/react-vis/react-vis.css" />
</head>
<body>
  <script>
    (() => {
      const DEFAULT_FONT_SIZE = 16;
      const FIXED_ACCENT = '#647255';
      const FIXED_FOCUS = '#7a8a69';
      const STORAGE_KEY = 'enana_state_v1';
      const root = document.documentElement;
      const body = document.body;
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : null;
        const appearance = parsed && parsed.settings ? parsed.settings.appearance || {} : {};
        const fontSize = Number(appearance.fontSize) || DEFAULT_FONT_SIZE;
        const mode = appearance.mode === 'night' ? 'night' : 'day';

        root.style.setProperty('--accent', FIXED_ACCENT);
        root.style.setProperty('--focus', FIXED_FOCUS);
        root.style.setProperty('--app-font-size', `${fontSize}px`);
        root.style.setProperty('font-size', `${fontSize}px`);
        body.classList.toggle('theme-night', mode === 'night');
        body.classList.add('ui-neutral-compact');
      } catch {}
    })();
  </script>
  <main class="app-shell">
    <header class="topbar">
      <div class="topbar-brand">
        <h1 class="sr-only">Enana</h1>
        <div class="topbar-context">
          <div class="topbar-heading-row">
            <p id="page-title" class="topbar-page-title">Home</p>
            <div id="topbar-view-actions" class="topbar-view-actions" hidden>
              <div id="topbar-assay-mode-switch" class="calendar-view-switch assay-mode-switch" role="group" aria-label="Assay mode">
                <button type="button" id="assay-mode-create-btn" class="ghost-btn calendar-view-active">Create Assay</button>
                <button type="button" id="assay-mode-results-btn" class="ghost-btn">View &amp; Results</button>
              </div>
            </div>
          </div>
          <p id="page-subtitle" class="sr-only">Reminders and active work.</p>
        </div>
      </div>
      <div class="topbar-tools">
        <input id="topbar-search" type="search" placeholder="Search modules or use sample: EGFR" aria-label="Search modules and records" />
        <button id="home-btn" class="topbar-icon-btn ghost-btn" type="button" aria-label="Go home" title="Home" hidden>
          <span class="app-nav-icon" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 10.5 12 4l8 6.5" />
              <path d="M6.5 9.5V20h11V9.5" />
              <path d="M10 20v-5h4v5" />
            </svg>
          </span>
        </button>
        <button id="topbar-settings-btn" class="topbar-icon-btn ghost-btn" type="button" aria-label="Open settings" title="Settings">
          <span class="app-nav-icon" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="2.75" />
              <path d="M12 4.5v2M12 17.5v2M19.5 12h-2M6.5 12h-2M17.3 6.7l-1.4 1.4M8.1 15.9l-1.4 1.4M17.3 17.3l-1.4-1.4M8.1 8.1 6.7 6.7" />
            </svg>
          </span>
        </button>
      </div>
    </header>
    <div class="workspace-shell">
      <section class="workspace-main">
