<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--
    Local-first app: everything is bundled, so nothing loads over the network.
    'wasm-unsafe-eval' is for the onnxruntime colony-counter model; 'unsafe-inline'
    on style-src covers the <style> blocks the print and sequence-preview documents
    build at runtime. blob: covers generated PDFs (print iframe + viewer popup).

    frame-src also carries loopback http for served plugins, which run on
    http://127.0.0.1:<random port> from the app's own plugin server. Without it
    a served plugin's frame is blocked outright and its view renders empty. The
    port is OS-assigned, hence the wildcard. IPv6 is deliberately absent: CSP
    host-source has no grammar for an address literal, so `http://[::1]:*` is
    dropped as invalid, and the plugin server binds 127.0.0.1 anyway. The frame
    still gets nothing but its own origin, and plugin-loader.js re-checks the URL with
    isSameOriginSafeUrl() before it decides the sandbox. Remote (`embed`)
    plugins would additionally need `https:` here, and deliberately do not have
    it — see docs/plugins/plugin-system.md §5.5.
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'wasm-unsafe-eval';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: blob:;
    font-src 'self' data:;
    connect-src 'self' data: blob:;
    frame-src 'self' blob: http://127.0.0.1:*;
    object-src 'none';
    base-uri 'none';
    form-action 'none';
  " />
  <title>Hikari</title>
  <link rel="icon" type="image/svg+xml" href="./assets/icon.svg" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="./vendor/cropperjs/cropper.min.css" />
  <link rel="stylesheet" href="./vendor/tabulator/tabulator.min.css" />
</head>
<body>
  <script type="module" src="src/renderer/bootstrap/index-shell.js"></script>
  <div id="app-loading-cover" class="app-loading-cover" aria-label="Loading Hikari" role="status">
    <div class="app-loading-cover__icon-shell" aria-hidden="true">
      <img class="app-loading-cover__icon" src="./assets/icons/hikari.svg" alt="" />
      <img class="app-loading-cover__icon app-loading-cover__icon--lit" src="./assets/icons/hikari.svg" alt="" />
    </div>
  </div>
  <main class="app-shell">
    <header class="topbar">
      <div class="topbar-brand">
        <h1 class="sr-only">Hikari</h1>
        <div class="topbar-context">
          <div class="topbar-heading-row">
            <div
              id="page-title"
              class="topbar-timer"
              role="progressbar"
              aria-label="Active timer"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
              hidden
            >
              <svg class="topbar-timer__ring" viewBox="0 0 36 36" aria-hidden="true" focusable="false">
                <circle class="topbar-timer__track" cx="18" cy="18" r="15.5" pathLength="100"></circle>
                <circle id="topbar-timer-progress" class="topbar-timer__progress" cx="18" cy="18" r="15.5" pathLength="100"></circle>
              </svg>
              <span id="topbar-timer-time" class="topbar-timer__time" aria-hidden="true">--:--</span>
            </div>
          </div>
          <p id="page-subtitle" class="sr-only">Reminders and active work.</p>
        </div>
      </div>
      <nav class="app-dock" aria-label="Primary navigation">
        <div id="app-dock-nav" class="app-dock-nav"></div>
        <div class="app-dock-divider" aria-hidden="true"></div>
        <button id="app-more-btn" class="app-dock-btn app-dock-btn-more" type="button" aria-label="More modules" title="More modules" aria-haspopup="menu" aria-expanded="false" aria-controls="app-more-menu">
          <span class="app-nav-icon" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect width="7" height="7" x="3" y="3" rx="1" />
              <rect width="7" height="7" x="14" y="3" rx="1" />
              <rect width="7" height="7" x="14" y="14" rx="1" />
              <rect width="7" height="7" x="3" y="14" rx="1" />
            </svg>
          </span>
          <span class="sr-only">More modules</span>
        </button>
        <div id="app-more-menu" class="app-more-menu" role="menu" aria-label="More modules" hidden></div>
      </nav>
      <div class="topbar-tools">
        <div class="topbar-history-controls" role="group" aria-label="Undo and redo">
          <button id="global-undo-btn" class="topbar-history-btn" type="button" aria-label="Undo" title="Nothing to undo" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M9 14 4 9l5-5" />
              <path d="M4 9h11a5 5 0 1 1 0 10h-4" />
            </svg>
          </button>
          <button id="global-redo-btn" class="topbar-history-btn" type="button" aria-label="Redo" title="Nothing to redo" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="m15 14 5-5-5-5" />
              <path d="M20 9H9a5 5 0 1 0 0 10h4" />
            </svg>
          </button>
        </div>
        <div class="topbar-search-shell">
          <span class="search-field topbar-search-field">
            <input id="topbar-search" type="search" aria-label="Search modules and records" aria-hidden="true" inert />
            <button id="topbar-search-toggle" class="search-field__lens" type="button" aria-label="Open search" title="Search" aria-expanded="false" aria-controls="topbar-search">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <circle cx="10.5" cy="10.5" r="6.5"></circle>
                <path d="m15.4 15.4 4.6 4.6"></path>
              </svg>
            </button>
          </span>
          <ul id="topbar-search-suggestions" class="topbar-search-suggestions" role="listbox" aria-label="Search suggestions" hidden></ul>
        </div>
      </div>
    </header>
    <div class="workspace-shell">
      <section class="workspace-main">
