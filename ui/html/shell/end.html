      </section>
      <aside id="universal-agent-chat-rail" class="universal-agent-chat-rail" aria-label="Agent Chat Rail" aria-hidden="true" data-state="collapsed" hidden>
        <div class="universal-agent-chat-rail__tools" role="group" aria-label="Workspace tools">
          <div id="paper-viewer-toolbar" class="papers-viewer-toolbar" role="toolbar" aria-label="PDF controls" aria-orientation="vertical" hidden>
            <div class="papers-viewer-page-cluster">
              <button
                type="button"
                id="paper-viewer-prev-btn"
                class="ghost-btn papers-viewer-page-nav-btn"
                aria-label="Previous page"
                title="Previous page"
              >
                <svg class="papers-viewer-toolbar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 14 6-6 6 6"></path></svg>
              </button>
              <label class="papers-viewer-page-field">
                <input id="paper-viewer-page-input" type="number" min="1" value="1" aria-label="Page number" />
              </label>
              <span id="paper-viewer-page-count" class="small-note">/ 0</span>
              <button
                type="button"
                id="paper-viewer-next-btn"
                class="ghost-btn papers-viewer-page-nav-btn"
                aria-label="Next page"
                title="Next page"
              >
                <svg class="papers-viewer-toolbar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 10 6 6 6-6"></path></svg>
              </button>
            </div>
            <div class="papers-viewer-zoom-cluster" role="group" aria-label="PDF zoom">
              <button type="button" id="paper-viewer-zoom-out-btn" class="ghost-btn papers-viewer-zoom-step-btn" aria-label="Zoom out" title="Zoom out">−</button>
              <span id="paper-viewer-zoom-label" class="small-note">100%</span>
              <button type="button" id="paper-viewer-zoom-in-btn" class="ghost-btn papers-viewer-zoom-step-btn" aria-label="Zoom in" title="Zoom in">+</button>
              <button type="button" id="paper-viewer-zoom-reset-btn" class="ghost-btn" aria-label="Reset zoom to 100%" title="Reset zoom to 100%">100%</button>
              <button type="button" id="paper-viewer-fit-width-btn" class="ghost-btn papers-viewer-toolbar-icon-btn" aria-label="Fit width" title="Fit width">
                <svg class="papers-viewer-toolbar-icon" viewBox="0 0 24 24" role="presentation" aria-hidden="true" focusable="false">
                  <rect x="4.5" y="6" width="15" height="12" rx="1.5"></rect>
                  <path d="M8 12h8"></path>
                  <path d="m10 9-3 3 3 3"></path>
                  <path d="m14 9 3 3-3 3"></path>
                </svg>
                <span class="sr-only">Fit width</span>
              </button>
            </div>
            <div class="papers-viewer-action-cluster" role="group" aria-label="Document actions">
              <button type="button" id="paper-viewer-print-btn" class="ghost-btn papers-viewer-toolbar-icon-btn" aria-label="Print" title="Print">
                <svg class="papers-viewer-toolbar-icon" viewBox="0 0 24 24" role="presentation" aria-hidden="true" focusable="false">
                  <path d="M7 8V4.75h10V8"></path>
                  <rect x="6" y="14" width="12" height="5.25" rx="1"></rect>
                  <path d="M6.5 17H5.25A2.25 2.25 0 0 1 3 14.75v-4A2.25 2.25 0 0 1 5.25 8.5h13.5A2.25 2.25 0 0 1 21 10.75v4A2.25 2.25 0 0 1 18.75 17H17.5"></path>
                  <path d="M8.25 16.5h7.5"></path>
                </svg>
                <span class="sr-only">Print</span>
              </button>
              <button type="button" id="paper-viewer-save-form-btn" class="ghost-btn papers-viewer-toolbar-icon-btn" aria-label="Save filled form" title="Save filled form" hidden>
                <svg class="papers-viewer-toolbar-icon" viewBox="0 0 24 24" role="presentation" aria-hidden="true" focusable="false">
                  <path d="M5.25 5.25h9.25L18.75 9.5v9.25H5.25z"></path>
                  <path d="M8.5 5.25v4h6"></path>
                  <rect x="8.5" y="12.75" width="7" height="6"></rect>
                </svg>
                <span class="sr-only">Save filled form</span>
              </button>
            </div>
          </div>
          <button type="button" id="paper-comment-toggle-btn" class="papers-context-toggle" aria-controls="paper-comment-sidebar" aria-expanded="false" aria-label="Open outline &amp; bookmarks" title="Outline &amp; bookmarks" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v12a2 2 0 0 0 2 2h2M4 8h4"></path><path d="M12 4h8v6l-4-2-4 2zM12 15h8M12 19h6"></path></svg>
          </button>
          <button type="button" id="paper-details-toggle-btn" class="papers-context-toggle" aria-controls="paper-details-sidebar" aria-expanded="false" aria-label="Open paper details" title="Paper details" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/></svg>
          </button>
          <button type="button" id="paper-brief-toggle-btn" class="papers-context-toggle" aria-controls="paper-research-brief" aria-expanded="false" aria-label="Open research brief" title="Research brief" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M8 12h8M8 16h5"/></svg>
          </button>
          <button type="button" id="agent-chat-rail-toggle-btn" class="universal-agent-chat-rail__toggle" aria-label="Open agent chat rail" aria-expanded="false" title="Open chat"><span class="agent-chat-icon universal-agent-chat-rail__toggle-icon" data-agent-chat-icon="chat" aria-hidden="true"></span></button>
        </div>
        <div class="universal-agent-chat-rail__content">
          <header class="universal-agent-chat-rail__header">
            <div>
              <h2>Chat</h2>
            </div>
          </header>
          <div class="agent-conversation-shell universal-agent-chat-rail__conversation is-empty-chat">
            <div class="agent-history-viewport">
              <div id="agent-rail-chat-history" class="agent-chat-history universal-agent-chat-rail__history" aria-live="polite"></div>
              <button type="button" id="agent-rail-scroll-to-bottom-btn" class="ghost-btn agent-scroll-to-bottom-btn" hidden>Latest</button>
            </div>
            <div class="agent-composer-shell universal-agent-chat-rail__composer">
              <div id="agent-rail-question-dock" class="agent-question-dock" aria-live="polite" hidden></div>
              <div id="agent-rail-quick-prompts" class="agent-rail-quick-prompts" aria-label="Common chat prompts">
                <button type="button" class="ghost-btn agent-rail-quick-prompt" data-agent-suggest-prompt="Summarize the current workspace context and call out useful next actions.">Summarize context</button>
                <button type="button" class="ghost-btn agent-rail-quick-prompt" data-agent-suggest-prompt="Suggest practical next steps from the current workspace context.">Plan next step</button>
                <button type="button" class="ghost-btn agent-rail-quick-prompt" data-agent-suggest-prompt="Flag missing details or follow-up questions from the current workspace context.">Find gaps</button>
              </div>
              <div class="stack-form agent-composer-card">
                <input id="agent-rail-attachment-input" type="file" multiple hidden />
                <label for="agent-rail-message-input" class="sr-only">Message</label>
                <div class="agent-composer-input-wrap">
                  <textarea id="agent-rail-message-input" rows="2" placeholder="Ask Hikari about this workspace."></textarea>
                </div>
                <div id="agent-rail-hidden-context-list" class="agent-attachment-list agent-hidden-context-list" aria-label="Injected context" aria-live="polite" hidden></div>
                <div id="agent-rail-attachment-list" class="agent-attachment-list" hidden></div>
                <div class="agent-composer-toolbar">
                  <div class="agent-composer-toolbar-start">
                    <button type="button" id="agent-rail-attach-btn" class="ghost-btn agent-attach-btn" aria-label="Attach photos or files" title="Attach photos or files"><span class="agent-chat-icon agent-attach-icon" data-agent-chat-icon="attach" aria-hidden="true"></span></button>
                    <button
                      type="button"
                      id="agent-rail-paper-screenshot-btn"
                      class="ghost-btn agent-paper-screenshot-btn"
                      aria-label="Select an area of the paper to attach"
                      aria-pressed="false"
                      title="Select area from paper"
                    >
                      <span class="agent-chat-icon agent-paper-screenshot-icon" data-agent-chat-icon="screenshot" aria-hidden="true"></span>
                    </button>
                  </div>
                  <div class="form-actions agent-composer-actions">
                    <button type="button" id="agent-rail-send-btn" class="primary-btn agent-send-icon-btn" aria-label="Send message" title="Send message">
                      <span class="agent-chat-icon agent-send-icon" data-agent-chat-icon="send" aria-hidden="true"></span>
                      <span class="sr-only">Send message</span>
                    </button>
                    <button type="button" id="agent-rail-stop-btn" class="danger-btn" hidden>Stop</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <div id="sequence-viewer-new-overlay" class="sequence-viewer-new-overlay app-dialog-overlay app-dialog-overlay--center" hidden>
    <form
      id="sequence-viewer-new-form"
      class="sequence-viewer-new-dialog app-dialog-surface"
      autocomplete="off"
      role="dialog"
      aria-modal="true"
      aria-labelledby="sequence-viewer-new-title"
      aria-describedby="sequence-viewer-new-description"
    >
      <div class="app-dialog-head">
        <div>
          <h3 id="sequence-viewer-new-title">New DNA Sequence</h3>
          <p id="sequence-viewer-new-description" class="small-note">Paste a DNA sequence or a supported sequence record.</p>
        </div>
        <button id="sequence-viewer-new-close-btn" type="button" class="app-dialog-close-btn" aria-label="Close new sequence dialog" title="Close"><span aria-hidden="true">&times;</span></button>
      </div>
      <label class="sequence-viewer-new-field" for="sequence-viewer-new-textarea">
        DNA Sequence
        <textarea
          id="sequence-viewer-new-textarea"
          rows="10"
          spellcheck="false"
          placeholder="Paste raw DNA, FASTA, FASTQ, or GenBank text."
          aria-describedby="sequence-viewer-new-description sequence-viewer-new-status"
        ></textarea>
      </label>
      <fieldset class="sequence-viewer-new-field sequence-viewer-new-topology">
        <legend>Topology</legend>
        <label><input type="radio" name="sequence-viewer-new-topology" value="linear" checked /> Linear</label>
        <label><input type="radio" name="sequence-viewer-new-topology" value="circular" /> Circular</label>
      </fieldset>
      <p id="sequence-viewer-new-status" class="small-note sequence-viewer-new-status" role="status" aria-live="polite" hidden></p>
      <div class="form-actions sequence-viewer-new-actions">
        <button id="sequence-viewer-new-cancel-btn" type="button" class="ghost-btn">Cancel</button>
        <button type="submit" class="primary-btn">Load Sequence</button>
      </div>
    </form>
  </div>

  <div id="unsaved-changes-overlay" class="unsaved-changes-overlay app-dialog-overlay app-dialog-overlay--center" hidden>
    <section class="unsaved-changes-dialog app-dialog-surface" role="dialog" aria-modal="true" aria-labelledby="unsaved-changes-title" aria-describedby="unsaved-changes-description">
      <div class="app-dialog-head">
        <div>
          <h3 id="unsaved-changes-title">Save changes before quitting?</h3>
          <p id="unsaved-changes-description" class="small-note">The following work has not been saved.</p>
        </div>
        <button type="button" id="unsaved-changes-close-btn" class="app-dialog-close-btn" aria-label="Close save changes dialog" title="Close"><span aria-hidden="true">&times;</span></button>
      </div>
      <ul id="unsaved-changes-list" class="unsaved-changes-list"></ul>
      <p id="unsaved-changes-status" class="small-note" role="status" aria-live="polite"></p>
      <div class="form-actions unsaved-changes-actions">
        <button type="button" id="unsaved-changes-discard-btn" class="danger-btn">Discard &amp; Quit</button>
        <button type="button" id="unsaved-changes-cancel-btn" class="ghost-btn">Cancel</button>
        <button type="button" id="unsaved-changes-save-btn" class="primary-btn">Save &amp; Quit</button>
      </div>
    </section>
  </div>

  <script src="./vendor/cropperjs/cropper.min.js"></script>
  <script src="./vendor/tabulator/tabulator.min.js"></script>
  <script src="./vendor/jspdf.umd.min.js"></script>
  <script src="./vendor/plotly/plotly.min.js"></script>
  <script type="module" src="src/renderer/renderer.js"></script>
</body>
</html>
