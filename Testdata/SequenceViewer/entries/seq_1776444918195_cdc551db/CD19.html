  <title>CD19</title>
  <style>
    :root {
      color-scheme: light;
      --preview-ink: #16314c;
      --preview-muted: #5a7592;
      --preview-backbone: #7e99ba;
      --preview-center-ring: #d8e4f2;
      --preview-center-disc: #f9fbfe;
      --preview-tick: #8ca5c5;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
    }
    body {
      font-family: "Playfair Display", serif;
      color: var(--preview-ink);
      overflow: hidden;
    }
    .preview-shell {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      margin: 0;
      padding: 8px;
    }
    svg {
      display: block;
      width: auto;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
    }
    .circular-preview__backbone {
      fill: none;
      stroke: var(--preview-backbone);
      stroke-width: 14;
    }
    .circular-preview__center-ring {
      fill: none;
      stroke: var(--preview-center-ring);
      stroke-width: 2;
    }
    .circular-preview__center-disc {
      fill: var(--preview-center-disc);
      stroke: var(--preview-center-ring);
      stroke-width: 2;
    }
    .circular-preview__tick {
      stroke: var(--preview-tick);
      stroke-width: 1.5;
      opacity: 0.9;
    }
    .circular-preview__feature {
      stroke-width: 1.5;
      stroke-linejoin: round;
    }
    .circular-preview__leader {
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.82;
    }
    .circular-preview__label-box {
      stroke-width: 1.2;
    }
    .circular-preview__label-text {
      font-size: 15px;
      font-weight: 600;
      dominant-baseline: middle;
      letter-spacing: 0.01em;
    }
    .circular-preview__title {
      fill: var(--preview-ink);
      font-size: 28px;
      font-weight: 700;
      text-anchor: middle;
    }
    .circular-preview__subtitle,
    .circular-preview__caption {
      text-anchor: middle;
      fill: var(--preview-muted);
      letter-spacing: 0.02em;
    }
    .circular-preview__subtitle {
      font-size: 15px;
      font-weight: 600;
    }
    .circular-preview__caption {
      font-size: 13px;
      text-transform: uppercase;
    }
  </style>
</head>
